<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music loops · levels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Yeseva+One&display=swap">
<style>
/* Ten styles, from happy to terrifying, each in 4 levels that stack as the story's stakes grow. A tap = the next level,
   which lands on the next bar with a riser into it (the transition); after level 4 a tap ends it (the release).
   Everything is synthesized (Web Audio), no files. One plays at a time. */
:root { --ui: 'Nunito', system-ui, sans-serif; --display: 'Yeseva One', Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #0b0a0f; color: #f5f5f7; font-family: var(--ui); }
header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: rgba(11,10,15,.94); border-bottom: 1px solid #2c2c2e; }
header h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; margin-right: auto; }
header a, header button { color: #8e8e93; text-decoration: none; font-weight: 800; font-size: 14px; background: none; border: 0; cursor: pointer; font-family: inherit; }
.ruler { margin: 16px 20px 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #8e8e93; }
.bar { margin: 6px 20px 0; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ffd60a, #30d158, #5ac8fa, #bf5af2, #ff9f0a, #ff453a, #7a0010); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding: 18px 20px 60px; }
.card { position: relative; text-align: left; font: inherit; color: inherit; border: 0; border-radius: 16px; padding: 16px 16px 14px; cursor: pointer; background: #17161c; border-left: 6px solid var(--c); display: flex; flex-direction: column; gap: 6px; transition: background .2s, transform .2s; }
.card:hover { background: #1f1d26; }
.card.on { background: color-mix(in srgb, var(--c) 22%, #17161c); transform: scale(1.02); box-shadow: 0 0 40px -8px var(--c); }
.card .n { font-size: 11px; font-weight: 900; color: var(--c); letter-spacing: .1em; }
.card h2 { margin: 0; font-size: 20px; font-weight: 900; }
.card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.card .tags i { font-style: normal; font-size: 12px; font-weight: 800; color: #c7c7cc; background: #2a2931; border-radius: 99px; padding: 3px 9px; }
.card p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.45; color: #aeaeb2; }
.card p b { color: #f5f5f7; }
.card .eq { position: absolute; right: 14px; top: 14px; display: flex; gap: 3px; align-items: flex-end; height: 16px; opacity: 0; }
.card.on .eq { opacity: 1; }
.eq u { width: 4px; background: var(--c); animation: eq .6s ease-in-out infinite alternate; }
.eq u:nth-child(2) { animation-delay: .15s; } .eq u:nth-child(3) { animation-delay: .3s; }
@keyframes eq { from { height: 4px; } to { height: 16px; } }
.pips { display: flex; gap: 6px; margin: 4px 0 2px; }
.pips button { flex: 1; font: inherit; font-size: 11px; font-weight: 900; color: #8e8e93; background: #2a2931; border: 0; border-radius: 6px; padding: 6px 0; cursor: pointer; transition: background .2s, color .2s; }
.pips button.on { background: var(--c); color: #000; }
.lv { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; line-height: 1.35; color: #8e8e93; }
.lv li { padding-left: 4px; border-left: 3px solid #2a2931; }
.lv li.on { color: #f5f5f7; border-left-color: var(--c); }
.lv li.past { color: #aeaeb2; }
.hint { font-size: 11px; font-weight: 800; color: var(--c); letter-spacing: .04em; min-height: 1.3em; }
</style>
</head>
<body>
<header><h1>Music loops · levels</h1><button type="button" id="stop">Stop</button><a href="tension.html">Tension levels ›</a><a href="index.html">‹ Home</a></header>
<div class="ruler"><span>Happy</span><span>Scary</span></div><div class="bar"></div>
<div class="grid" id="grid"></div>
<script>
const $ = (s) => document.querySelector(s);
let ac, master, cur = null, timer, next = 0, S = 0, L = 0, pend = null;
const mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);
const rnd = (k) => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function boot() { if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)(); const c = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = .75; master.connect(c); c.connect(ac.destination); }
let nbuf; const noiseBuf = () => nbuf || (() => { nbuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return nbuf; })();
function tone(t, n, dur, o = {}) {
  const osc = ac.createOscillator(), g = ac.createGain(), a = o.a || .005; osc.type = o.type || 'triangle'; osc.frequency.setValueAtTime(mtof(n), t);
  if (o.glide != null) osc.frequency.exponentialRampToValueAtTime(mtof(o.glide), t + dur); if (o.det) osc.detune.value = o.det;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(o.vol || .3, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let out = osc; if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); out = f; }
  out.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + .05);
}
const pad = (t, notes, dur, vol = .09, type = 'sawtooth', lp = 700) => notes.forEach((n, k) => tone(t, n, dur, { type, vol, a: dur * .35, lp, det: k * 4 - 4 }));
function noise(t, dur, o = {}) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), a = o.a || .002; s.buffer = noiseBuf(); f.type = o.type || 'highpass'; f.frequency.setValueAtTime(o.f || 7000, t); f.Q.value = o.q || 1;
  if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(o.vol || .1, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .05);
}
const kick = (t, v = .7) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(125, t); o.frequency.exponentialRampToValueAtTime(42, t + .13); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .26); o.connect(g); g.connect(master); o.start(t); o.stop(t + .3); };
const snare = (t, v = .3) => { noise(t, .15, { f: 1800, type: 'bandpass', vol: v }); tone(t, 55, .1, { type: 'triangle', vol: v }); };
const hat = (t, v = .08) => noise(t, .05, { f: 7000, vol: v });
const click = (t, v = .14) => noise(t, .03, { f: 1400, type: 'bandpass', q: 4, vol: v });
// transitions: a riser into the next bar (or a falling sweep going down), then an impact where the new level lands
function rise(t0, t1, up = true) { const d = Math.max(.15, t1 - t0); noise(t0, d, { f: up ? 400 : 6000, sweep: up ? 8000 : 400, type: 'bandpass', q: 2, vol: up ? .22 : .12, a: up ? d * .9 : .02 });
  tone(t0, up ? 50 : 86, d, { type: 'sawtooth', vol: .06, glide: up ? 86 : 50, a: up ? d * .8 : .02, lp: 2500 }); }
function impact(t, big = .55) { tone(t, 38, .9, { type: 'sine', vol: big, glide: 30 }); noise(t, .5, { f: 2500, sweep: 200, type: 'lowpass', vol: big * .6 }); }
// the end after level 4: boom (hits), chime (resolves, bright), sigh (falls and fades)
function finish(kind, t) {
  if (kind === 'boom') { impact(t, 1); noise(t, 1.4, { f: 3000, sweep: 80, type: 'lowpass', vol: .8 }); }
  else if (kind === 'chime') [72, 76, 79, 84, 88].forEach((n, k) => tone(t + k * .07, n, 2.6, { type: 'sine', vol: .16 }));
  else [57, 52, 45].forEach((n, k) => tone(t + k * .25, n, 3, { type: 'sine', vol: .2, a: .1 }));
}

// the styles, happy → scary. lv: what each level adds. bpm: per level. step(i, bar, t, bl, L): i = the 16th step in the bar (0..15)
const LOOPS = [
  { id: 'joy', name: 'Sunny day', emo: 'joy', c: '#ffd60a', end: 'chime', bpm: [112, 118, 124, 132], fits: 'The gang’s together → a win → the whole bar cheers.',
    lv: ['Bass and a light bounce', 'A kick and shakers', 'A busy melody, a clap', 'A high lead, everything dancing'],
    step(i, bar, t, bl, L) { const R = [48, 43, 45, 41][bar % 4], m = bar % 4 === 2 ? 3 : 4;
      if (i % 4 === 0) tone(t, R, .22, { vol: .5 }); if (i % 4 === 2) tone(t, R + 24 + [0, m, 7, 12][(i >> 2) % 4], .14, { vol: .18, lp: 4000 });
      if (L >= 1) { if (i % 4 === 0) kick(t, .5); if (i % 2) hat(t, .06); }
      if (L >= 2) { if (i % 2 === 0) tone(t, R + 24 + [0, m, 7, 12, 7, m, 7, 9][(i / 2) % 8], .14, { vol: .16, lp: 4000 }); if (i === 4 || i === 12) noise(t, .08, { f: 1800, type: 'bandpass', vol: .15 }); }
      if (L >= 3) { if ([0, 3, 6, 8, 11, 14].includes(i)) tone(t, R + 36 + [0, 4, 7, 9][Math.floor(rnd(S) * 4)], .2, { type: 'square', vol: .07, lp: 3500 }); if (i % 2 === 0) tone(t, R + 12, .1, { vol: .25 }); } } },
  { id: 'cozy', name: 'Warm blanket', emo: 'comfort', c: '#30d158', end: 'chime', bpm: [74, 78, 82, 86], fits: 'A quiet kitchen → someone sits down → the whole family around the table.',
    lv: ['A warm pad, nothing else', 'A soft melody floats in', 'A low note, brushed hats', 'Chimes and a second voice'],
    step(i, bar, t, bl, L) { const R = [41, 46, 48, 41][bar % 4]; if (i === 0) pad(t, [R + 12, R + 16, R + 19], bl * 1.05, .1, 'sine', 900);
      if (L >= 1 && (i === 0 || i === 6 || i === 10)) tone(t, R + 31 + [0, 2, 4, -3][Math.floor(rnd(S) * 4)], .8, { type: 'sine', vol: .16 });
      if (L >= 2) { if (i === 0 || i === 8) tone(t, R, 1, { type: 'sine', vol: .3 }); if (i % 4 === 2) hat(t, .04); }
      if (L >= 3) { if (i % 4 === 0) tone(t, R + 36 + [0, 4, 7, 12][(i >> 2) % 4], .9, { type: 'sine', vol: .1 }); if (i === 6 || i === 14) tone(t, R + 28, .8, { type: 'sine', vol: .1 }); } } },
  { id: 'quirk', name: 'Tiptoe', emo: 'playful', c: '#5ac8fa', end: 'chime', bpm: [120, 126, 132, 142], fits: 'Sneaking in → the plan comes together → it all goes wrong, comically.',
    lv: ['A sneaky bass and a tick', 'A staccato melody', 'Answers an octave up, more ticks', 'A running pizzicato and a snare roll'],
    step(i, bar, t, bl, L) { const R = [43, 43, 50, 48][bar % 4]; if (i === 0 || i === 6 || i === 10) tone(t, R, .1, { vol: .5 }); if (i % 4 === 2) click(t, .08);
      if (L >= 1 && [0, 3, 6, 8, 11, 14].includes(i)) tone(t, [67, 71, 74, 71, 69, 72, 76, 72][Math.floor(rnd(S + bar) * 8)], .07, { type: 'square', vol: .06, lp: 2500 });
      if (L >= 2) { if (i === 1 || i === 9) tone(t, R + 24, .06, { type: 'square', vol: .05, lp: 2500 }); if (i % 2) click(t, .1); }
      if (L >= 3) { if (bar % 4 === 3 && i % 2 === 0) tone(t, R + 24 + i / 2, .06, { type: 'square', vol: .06, lp: 3000 }); if (bar % 4 === 3 && i >= 12) snare(t, .14); } } },
  { id: 'love', name: 'Slow glance', emo: 'tender', c: '#ff6b8a', end: 'chime', bpm: [66, 70, 72, 76], fits: 'A look across the room → she stays → the thing neither of them says.',
    lv: ['A soft pad', 'A slow arpeggio', 'Bells and a heartbeat', 'Strings swell, the melody climbs'],
    step(i, bar, t, bl, L) { const R = [45, 41, 48, 43][bar % 4], q = bar % 4 === 0 ? 3 : 4; if (i === 0) pad(t, [R + 12, R + 12 + q, R + 19], bl * 1.05, .08, 'sine', 800);
      if (L >= 1 && i % 4 === 0) tone(t, R + 24 + [0, 7, 12, q + 12][(i >> 2) % 4], .9, { type: 'sine', vol: .17 });
      if (L >= 2) { if (i % 2 === 0) tone(t, R + 36 + [0, 7, 12, q + 12][(i >> 1) % 4], 1, { type: 'sine', vol: .09 }); if (i === 0 || i === 3) kick(t, .22); }
      if (L >= 3) { if (i === 0) pad(t, [R + 24, R + 24 + q, R + 31], bl, .07, 'sawtooth', 900); if (i === 0 || i === 8) tone(t, R + 36 + [0, 2, 4, 7][bar % 4], 1.6, { type: 'sine', vol: .15 }); } } },
  { id: 'hero', name: 'Into the storm', emo: 'epic', c: '#ff9f0a', end: 'boom', bpm: [126, 134, 142, 152], fits: 'The crew gets up → the ship leaves → the whole fleet at once.',
    lv: ['A driving bass', 'Drums come in', 'Brass stabs', 'A heroic lead and cymbals'],
    step(i, bar, t, bl, L) { const R = [38, 38, 34, 36][bar % 4]; if (i % 2 === 0) tone(t, R, .12, { type: 'sawtooth', vol: .3, lp: 500 });
      if (L >= 1) { if (i === 0 || i === 8) kick(t, .7); if (i === 4 || i === 12) snare(t); if (i % 2) hat(t, .05); }
      if (L >= 2) { if (i === 10) kick(t, .6); if (i === 0 || i === 6 || i === 10) [R + 24, R + 27, R + 31].forEach((n) => tone(t, n, .24, { type: 'sawtooth', vol: .07, lp: 1800 })); }
      if (L >= 3) { if ([0, 2, 3, 6, 8, 10, 11, 14].includes(i)) tone(t, R + 36 + [0, 3, 5, 7, 10, 7, 5, 3][Math.floor(rnd(S + 9) * 8)], .2, { type: 'square', vol: .06, lp: 2800 }); if (i === 0 && bar % 2 === 0) noise(t, 1, { f: 5000, vol: .12 }); hat(t, .05); } } },
  { id: 'myst', name: 'Who’s there?', emo: 'curious', c: '#bf5af2', end: 'sigh', bpm: [84, 86, 88, 92], fits: 'A strange silence → a clue → the door opens by itself.',
    lv: ['A low drone', 'Sparse bells', 'Denser bells and a sub throb', 'Clashing swells and a tick'],
    step(i, bar, t, bl, L) { if (i === 0 && bar % 2 === 0) pad(t, [40, 47, 52], bl * 2.1, .09, 'sawtooth', 500);
      if (L >= 1 && i % 4 === 2 && rnd(S) > .5) tone(t, [76, 77, 79, 83, 84][Math.floor(rnd(S + 3) * 5)], 1.5, { type: 'sine', vol: .13 });
      if (L >= 2) { if (i % 2 === 0 && rnd(S + 7) > .55) tone(t, [76, 77, 79, 83, 84][Math.floor(rnd(S + 5) * 5)], 1.2, { type: 'sine', vol: .1 }); if (i === 0 || i === 8) tone(t, 28, .6, { type: 'sine', vol: .3 }); }
      if (L >= 3) { if (i === 0) pad(t, [64, 65, 70], bl, .06, 'sawtooth', 900); if (i === 0 && bar % 2) noise(t, bl, { f: 500, sweep: 3500, type: 'bandpass', q: 2, vol: .08, a: bl * .8 }); if (i % 4 === 0) click(t, .1); } } },
  { id: 'sad', name: 'The empty chair', emo: 'sad', c: '#6e8bd6', end: 'sigh', bpm: [54, 56, 58, 60], fits: 'A letter arrives → it’s true → he finally says it out loud.',
    lv: ['A low, slow pad', 'A falling melody', 'A cello below, a second voice', 'Repeated notes climbing, the weight comes'],
    step(i, bar, t, bl, L) { const R = [45, 41, 48, 40][bar % 4], q = bar % 4 === 0 ? 3 : 4; if (i === 0) pad(t, [R + 12, R + 12 + q, R + 19], bl * 1.05, .09, 'sine', 700);
      if (L >= 1) { if (i === 0) tone(t, [76, 74, 72, 71][bar % 4], 2.2, { type: 'sine', vol: .2 }); if (i === 8) tone(t, [72, 71, 69, 68][bar % 4], 2, { type: 'sine', vol: .16 }); }
      if (L >= 2) { if (i === 0) tone(t, R, bl, { type: 'sawtooth', vol: .16, lp: 300, a: .3 }); if (i === 4) tone(t, [79, 77, 76, 75][bar % 4], 1.6, { type: 'sine', vol: .1 }); }
      if (L >= 3) { if (i % 2 === 0) tone(t, R + 36 + [0, 2, 4, 7][bar % 4], .5, { type: 'sine', vol: .1 }); if (i === 0) kick(t, .3); } } },
  { id: 'tense', name: 'Walls closing', emo: 'tense', c: '#ff453a', end: 'boom', bpm: [92, 102, 116, 126], fits: 'The meeting starts → someone’s late → the clock runs out. (see Tension levels)',
    lv: ['A single pulse, D D D D', 'A low drone, a tick between', 'A kick and a clashing E♭', 'Sixteenth pulses climbing, a hiss'],
    step(i, bar, t, bl, L) { if (L === 0 ? i % 4 === 0 : i % 2 === 0) tone(t, i === 14 && L >= 2 ? 39 : 38 + (L >= 3 ? bar % 4 : 0), .16, { vol: .5 });
      if (L >= 1) { if (i === 0 && bar % 2 === 0) pad(t, [26, 33], bl * 2, .12, 'sine', 300); if (i % 4 === 2) hat(t, .1); }
      if (L >= 2) { if (i % 4 === 0) kick(t, .8); if (i === 0 && bar % 2 === 0) pad(t, [50, 51], bl * 2, .06, 'sawtooth', 450); }
      if (L >= 3) { if (i % 2) tone(t, 38 + bar % 4, .1, { vol: .3 }); if (i === 0) noise(t, bl, { f: 800, sweep: 7000, type: 'bandpass', q: 2, vol: .1, a: bl * .9 }); hat(t, .08); } } },
  { id: 'creep', name: 'Music box', emo: 'creepy', c: '#a14a7a', end: 'sigh', bpm: [66, 70, 74, 80], fits: 'A quiet room → the lullaby plays → it’s coming from the wrong place.',
    lv: ['A drone, one note now and then', 'The music box plays', 'A heartbeat and a whisper swell', 'The box falls apart: faster, detuned, a screech'],
    step(i, bar, t, bl, L) { if (i === 0 && bar % 2 === 0) pad(t, [38, 39], bl * 2.1, .08, 'sawtooth', 300);
      if (L === 0 && i === 0 && rnd(S) > .5) tone(t, 76, 1.4, { type: 'sine', vol: .08 });
      if (L >= 1 && [0, 2, 5, 7, 8, 10, 13].includes(i)) { const n = [69, 72, 76, 75, 72, 71, 68, 64][Math.floor(rnd(S) * 8)]; tone(t, n, 1, { type: 'sine', vol: .1 }); tone(t, n, 1, { type: 'triangle', vol: .05, det: L >= 3 ? 55 : 28 }); }
      if (L >= 2) { if (bar % 2 && (i === 0 || i === 2)) kick(t, .3); if (bar % 4 === 3 && i === 8) noise(t, bl / 2, { f: 400, sweep: 5000, type: 'bandpass', q: 3, vol: .09, a: bl * .35 }); }
      if (L >= 3) { if (i % 2) tone(t, 76 + Math.floor(rnd(S + 2) * 12), .2, { type: 'sine', vol: .06, det: 60 }); if (i === 14 && bar % 2) tone(t, 78, .5, { type: 'sawtooth', vol: .07, glide: 100, lp: 4000 }); } } },
  { id: 'terror', name: 'Run', emo: 'terror', c: '#c4122f', end: 'boom', bpm: [120, 134, 146, 160], fits: 'Lights flicker → footsteps → it’s in the house.',
    lv: ['A slow sub pulse', 'A kick joins, four on the floor', 'Clashing stabs and hats', 'Sixteenth sub, screeches, noise bursts'],
    step(i, bar, t, bl, L) { if (i % 2 === 0 || L >= 3) tone(t, bar % 2 ? 27 : 26, .11, { type: 'sawtooth', vol: .4, lp: 260 });
      if (L >= 1 && i % 4 === 0) kick(t, .85);
      if (L >= 2) { if (i === 0 || i === 6 || i === 11) [50, 51, 57].forEach((n) => tone(t, n, .18, { type: 'sawtooth', vol: .09, lp: 3000 })); if (i % 2) hat(t, .08); }
      if (L >= 3) { if (i === 14 && bar % 2) tone(t, 78, .5, { type: 'sawtooth', vol: .08, glide: 100, lp: 4000 }); if (i % 4 === 3) noise(t, .1, { f: 3000, type: 'bandpass', vol: .12 }); if (i === 4 || i === 10) [50, 51, 57].forEach((n) => tone(t, n, .15, { type: 'sawtooth', vol: .07, lp: 3000 })); } } },
];
const stepDur = (Lv) => 60 / cur.bpm[Lv] / 4;
function sched() { if (!cur) return;
  while (next < ac.currentTime + .12) {
    if (pend && next >= pend.at - .001) { L = pend.L; pend = null; paint(); }
    cur.step(S % 16, Math.floor(S / 16), next, stepDur(L) * 16, L); next += stepDur(L); S++;
  } }
// go to a level: it lands on the next bar (never mid-bar), with a riser into it and an impact on it
function goto(n) {
  if (n === (pend ? pend.L : L)) return;
  const bl = stepDur(L) * 16, toBar = ((16 - S % 16) % 16) * stepDur(L), now = ac.currentTime;
  let at = next + toBar; if (at - now < .5) at += bl;
  const up = n > (pend ? pend.L : L); pend = { L: n, at }; rise(Math.max(now, at - 1.4), at, up); impact(at, up ? .5 : .3); paint();
}
function play(Lp, lv = 0) { boot(); ac.resume(); clearInterval(timer); cur = Lp; L = lv; pend = null; S = 0; next = ac.currentTime + .06; timer = setInterval(sched, 25); paint(); }
function stop(fin) { clearInterval(timer); if (fin && cur && ac) finish(cur.end, ac.currentTime + .05); cur = null; pend = null; paint(); }
function tap(Lp) { if (cur !== Lp) return play(Lp); const at = pend ? pend.L : L; if (at >= 3) { stop(true); } else goto(at + 1); }
function paint() {
  document.querySelectorAll('.card').forEach((c) => { const on = cur && c.dataset.id === cur.id, lv = on ? (pend ? pend.L : L) : -1;
    c.classList.toggle('on', !!on);
    c.querySelectorAll('.pips button').forEach((b, k) => b.classList.toggle('on', k <= lv));
    c.querySelectorAll('.lv li').forEach((li, k) => { li.classList.toggle('on', k === lv); li.classList.toggle('past', k < lv); });
    c.querySelector('.hint').textContent = !on ? 'Tap to start' : lv >= 3 ? 'Tap: the end' : 'Tap: more intense'; });
}
$('#grid').innerHTML = LOOPS.map((Lp, k) => `<div class="card" data-id="${Lp.id}" style="--c:${Lp.c}" role="button" tabindex="0"><span class="eq"><u></u><u></u><u></u></span>
  <span class="n">${String(k + 1).padStart(2, '0')} · ${Lp.emo.toUpperCase()} · ${Lp.bpm[0]}→${Lp.bpm[3]} BPM</span><h2>${Lp.name}</h2>
  <div class="pips">${[1, 2, 3, 4].map((n) => `<button type="button" data-lv="${n - 1}">${n}</button>`).join('')}</div><div class="hint"></div>
  <ol class="lv">${Lp.lv.map((t) => `<li>${t}</li>`).join('')}</ol><p><b>Fits:</b> ${Lp.fits}</p></div>`).join('');
$('#grid').onclick = (e) => { const c = e.target.closest('.card'); if (!c) return; const Lp = LOOPS.find((x) => x.id === c.dataset.id), pb = e.target.closest('.pips button');
  if (pb) { const n = +pb.dataset.lv; if (cur !== Lp) play(Lp, n); else goto(n); return; } tap(Lp); };
$('#stop').onclick = () => stop(false);
</script>
</body>
</html>
