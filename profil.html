<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fake onboarding</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Yeseva+One&display=swap">
<style>
/* A fake onboarding (test page): 1 · music profile (six aura orbs, tap one = its song, the others go quiet), 2 · pick a character.
   Drill is the Double It loop (sfx/); the other five are synthesized here (Web Audio), no files. Nothing is saved. */
:root { --ui: 'Nunito', system-ui, sans-serif; --display: 'Yeseva One', Georgia, serif; --mute: #8e8e93; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #07060b; color: #f5f5f7; font-family: var(--ui); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; }
.back { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; z-index: 5; color: var(--mute); text-decoration: none; font-weight: 800; font-size: 14px; }
.dots { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
.dots i { width: 22px; height: 4px; border-radius: 2px; background: #2c2c2e; transition: background .3s; }
.dots i.on { background: #f5f5f7; }
.page { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 60px 20px max(18px, env(safe-area-inset-bottom)); transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; }
.page.out { transform: translateX(-40px); opacity: 0; pointer-events: none; }
.page.next { transform: translateX(40px); opacity: 0; pointer-events: none; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 8vw, 38px); line-height: 1.1; text-align: center; }
.sub { color: var(--mute); text-align: center; font-weight: 700; font-size: 15px; margin-top: 8px; min-height: 1.3em; }

/* 1 · the orbs */
#orbs { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 4px 10px; align-items: center; justify-items: center; min-height: 0; padding: 6px 0; }
.orbw { position: relative; width: 100%; height: 100%; display: grid; place-items: center; min-height: 0; }
.orb { --c: #888; --lvl: 0; --bass: 0; --mid: 0; --hi: 0; position: relative; width: min(34vw, 30vh, 150px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  transition: opacity .5s, filter .5s, transform .5s; animation: float 5s ease-in-out infinite; animation-delay: var(--d, 0s); }
.orb::before { /* the aura */ content: ''; position: absolute; inset: -22%; border-radius: 50%; z-index: 0;
  background: radial-gradient(circle, color-mix(in srgb, var(--c) 55%, transparent) 0%, transparent 68%); opacity: calc(.45 + var(--lvl) * .9); transform: scale(calc(1 + var(--bass) * .55)); filter: blur(6px); }
.orb .core { position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--c) 40%, #fff) 0%, var(--c) 42%, color-mix(in srgb, var(--c) 45%, #000) 100%);
  box-shadow: inset -8px -10px 22px rgba(0,0,0,.45), inset 6px 6px 16px rgba(255,255,255,.18), 0 0 calc(18px + var(--bass) * 60px) color-mix(in srgb, var(--c) 70%, transparent);
  transform: scale(calc(1 + var(--bass) * .22)); }
.orb .sheen { position: absolute; z-index: 2; inset: 12%; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; opacity: calc(.15 + var(--hi) * .9);
  background: conic-gradient(from 0deg, transparent, color-mix(in srgb, var(--c) 30%, #fff), transparent 35%, transparent 60%, color-mix(in srgb, var(--c) 30%, #fff), transparent); animation: spin 3s linear infinite; animation-play-state: paused; filter: blur(5px); }
.orb .ring { position: absolute; z-index: 0; inset: 0; border-radius: 50%; border: 2px solid var(--c); opacity: 0; pointer-events: none; }
.orb .lab { position: absolute; z-index: 3; bottom: -22px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-weight: 900; font-size: 13px; letter-spacing: .02em; color: #c7c7cc; transition: color .3s; }
.orb.on { animation: none; z-index: 2; }
.orb.on .sheen { animation-play-state: running; }
.orb.on .ring { animation: ripple 1.1s ease-out infinite; }
.orb.on .ring + .ring { animation-delay: .55s; }
.orb.on .lab { color: #fff; }
.orb.on .core { border-radius: calc(50% - var(--mid) * 9%) calc(50% + var(--mid) * 6%) calc(50% - var(--mid) * 5%) calc(50% + var(--mid) * 9%) / calc(50% + var(--mid) * 8%) calc(50% - var(--mid) * 8%) calc(50% + var(--mid) * 6%) calc(50% - var(--mid) * 6%); }
.orbs-playing .orb:not(.on) { opacity: .35; filter: saturate(.4); transform: scale(.88); }
@keyframes float { 50% { transform: translateY(-8px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
.foot { text-align: center; padding-top: 6px; }
.cta { display: block; width: 100%; padding: 15px; border-radius: 99px; background: #f5f5f7; color: #000; font-weight: 900; font-size: 17px; transition: opacity .3s, transform .15s; }
.cta:active { transform: scale(.98); }
.cta[disabled] { opacity: .3; pointer-events: none; }
.soon { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--mute); }
.soon button { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #48484a; }

/* 2 · the characters */
#chars { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: center; min-height: 0; padding: 18px 0 10px; }
.ch { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 3/5; background: var(--bg); border: 2px solid transparent; transition: transform .3s, border-color .3s, box-shadow .3s, opacity .3s; text-align: center; }
.ch img { position: absolute; left: 50%; bottom: 0; height: 92%; transform: translateX(-50%); object-fit: contain; }
.ch::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,.75)); }
.ch b { position: absolute; z-index: 1; left: 0; right: 0; bottom: 10px; font-family: var(--display); font-weight: 400; font-size: 20px; }
.ch small { position: absolute; z-index: 1; left: 0; right: 0; bottom: 34px; font-size: 11px; font-weight: 800; color: #d1d1d6; opacity: 0; }
#chars.pick .ch:not(.on) { opacity: .45; transform: scale(.95); }
.ch.on { border-color: #fff; transform: scale(1.04); box-shadow: 0 0 40px color-mix(in srgb, var(--bg) 80%, transparent); }
.mine { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; border-radius: 22px; border: 2px dashed #48484a; margin-bottom: 12px; font-weight: 900; font-size: 16px; transition: border-color .2s, background .2s; }
.mine:hover, .mine:active { border-color: #8e8e93; background: #151419; }
.mine span { color: var(--mute); font-weight: 700; font-size: 13px; }
.mine svg { width: 22px; height: 22px; flex: none; }

#toast { position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 20px); background: #2c2c2e; padding: 10px 18px; border-radius: 99px; font-weight: 800; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 9; white-space: nowrap; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#done { position: absolute; inset: 0; z-index: 8; background: #07060b; display: grid; place-items: center; text-align: center; padding: 30px; opacity: 0; pointer-events: none; transition: opacity .5s; }
#done.show { opacity: 1; pointer-events: auto; }
#done p { color: var(--mute); font-weight: 700; margin: 10px 0 22px; }
#done a { color: #8e8e93; font-weight: 800; text-decoration: none; display: block; margin-top: 18px; }
</style>
</head>
<body>
<div id="app">
  <a class="back" href="index.html">‹ Home</a>
  <div class="dots"><i class="on"></i><i></i></div>

  <section class="page" id="p1">
    <h1>Your music profile</h1>
    <div class="sub" id="sub1">Tap an aura. Find your sound.</div>
    <div id="orbs"></div>
    <div class="foot">
      <button type="button" class="cta" id="next1" disabled>Next</button>
      <div class="soon"><button type="button" id="songs">+ Add your favorite songs</button> · coming soon</div>
    </div>
  </section>

  <section class="page next" id="p2">
    <h1>Pick your character</h1>
    <div class="sub">You can change it later.</div>
    <div id="chars"></div>
    <div class="foot">
      <button type="button" class="mine" id="mine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Create your own <span>· takes 1 minute</span>
      </button>
      <button type="button" class="cta" id="next2" disabled>Start</button>
    </div>
  </section>

  <div id="toast"></div>
  <div id="done"><div><h1 id="doneT">You're in.</h1><p id="doneP"></p><button type="button" class="cta" id="again">Run it again</button><a href="index.html">‹ Home</a></div></div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const toast = (t) => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 1600); };

/* ---------- the six sounds ---------- */
// gray = drill: the Double It loop (the real file). The other five are small synthesized grooves: a tempo, 16 steps, a few voices.
const SONGS = [
  { id: 'drill',  name: 'Drill',   c: '#9a9aa0', sub: 'Cold, sliding 808s. Drill.',          file: 'double it loop 2 drop', bpm: 140 },
  { id: 'phonk',  name: 'Phonk',   c: '#ff2d2d', sub: 'Cowbells and a dirty bass. Phonk.',   bpm: 132 },
  { id: 'lofi',   name: 'Lo-fi',   c: '#b07cff', sub: 'Dusty keys, slow head nod. Lo-fi.',   bpm: 78 },
  { id: 'afro',   name: 'Afro',    c: '#ffb020', sub: 'Warm, bouncy, sun on you. Afrobeats.', bpm: 104 },
  { id: 'dream',  name: 'Dream',   c: '#35c8ff', sub: 'Floating, wide, a bit lost. Dream.',  bpm: 90 },
  { id: 'dance',  name: 'Dance',   c: '#ff5fb0', sub: 'Four on the floor. Dance.',           bpm: 124 },
];
let ac, master, an, fbuf = new Uint8Array(256), cur = null, timer = 0, nextT = 0, step = 0, loopSrc = null, loopBuf = {}, noise;

function boot() {
  if (ac) return ac.resume();
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = .85;
  an = ac.createAnalyser(); an.fftSize = 512; an.smoothingTimeConstant = .6;
  master.connect(an); an.connect(comp); comp.connect(ac.destination);
  noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return ac.resume();
}
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); }
function osc(out, type, f, t, dur, peak, a = .004, f2) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, a, peak, dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
}
function nz(out, t, dur, peak, type = 'highpass', freq = 7000, q = 1) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
  env(g, t, .001, peak, dur); s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
const kick = (o, t, v = .9) => osc(o, 'sine', 150, t, .3, v, .002, 42);
const snare = (o, t, v = .4) => { nz(o, t, .16, v, 'bandpass', 1800, .7); osc(o, 'triangle', 190, t, .1, v * .5, .002, 120); };
const hat = (o, t, v = .1) => nz(o, t, .045, v);
const lp = (o, f) => { const x = ac.createBiquadFilter(); x.type = 'lowpass'; x.frequency.value = f; x.connect(o); return x; };

// each groove: (out, t, i, spb) → called once per 16th step (i = 0..15, then it loops), spb = seconds per 16th
const GROOVES = {
  phonk(o, t, i) {
    if ([0, 3, 8, 10].includes(i)) kick(o, t, 1);
    if (i === 4 || i === 12) snare(o, t, .45);
    if (i % 2 === 0) hat(o, t, .08);
    const bell = { 0: 1, 3: 1, 6: 1, 8: 1, 11: 1, 14: 1 };   // the cowbell: two square waves, the memphis way
    if (bell[i]) { const f = lp(o, 4200); osc(f, 'square', 587, t, .16, .16, .001); osc(f, 'square', 845, t, .16, .16, .001); }
    if ([0, 3, 8, 11].includes(i)) osc(lp(o, 300), 'sawtooth', mtof(33 + (i > 7 ? -2 : 0)), t, .42, .5, .005, mtof(31));   // the 808 slide
  },
  lofi(o, t, i) {
    if (i === 0 || i === 10) kick(o, t, .7);
    if (i === 4 || i === 12) snare(o, t, .22);
    if (i % 2 === 0) hat(o, t, .035);
    const ch = [[57, 60, 64, 67], [53, 57, 60, 64]][i < 8 ? 0 : 1];   // Am7 → Fmaj7
    if (i === 0 || i === 8 || i === 6 || i === 14) ch.forEach((m, k) => osc(lp(o, 1500), 'triangle', mtof(m) * (1 + (Math.random() - .5) * .004), t + k * .012, 1.1, .1, .01));
    if (i === 0 || i === 8) osc(lp(o, 250), 'sine', mtof(i ? 41 : 45), t, 1, .35, .01);
  },
  afro(o, t, i) {
    if (i === 0 || i === 6 || i === 10) kick(o, t, .8);
    if (i === 4 || i === 12) snare(o, t, .26);
    if (i % 2 === 1) hat(o, t, .06);
    if ([2, 5, 8, 11, 14].includes(i)) osc(o, 'sine', 1200 - i * 18, t, .09, .12, .001);   // woodblock-ish
    const mel = { 0: 69, 3: 72, 6: 76, 8: 74, 11: 72, 14: 69 };
    if (mel[i]) osc(lp(o, 3000), 'triangle', mtof(mel[i]), t, .3, .18, .004);
    if (i === 0 || i === 8) osc(lp(o, 300), 'sine', mtof(i ? 36 : 33), t, .55, .5, .005);
  },
  dream(o, t, i) {
    if (i === 0) { const c = [[57, 64, 72], [60, 67, 76], [53, 60, 69], [55, 62, 71]][GROOVES.dream.bar++ % 4]; c.forEach((m) => { const f = lp(o, 1800); osc(f, 'sawtooth', mtof(m), t, 2.6, .05, .5); osc(f, 'sawtooth', mtof(m) * 1.006, t, 2.6, .05, .5); }); }
    const arp = [72, 76, 79, 83, 79, 76, 72, 76][(i / 2) | 0];   // a soft arpeggio on every 8th
    if (i % 2 === 0) osc(lp(o, 4000), 'sine', mtof(arp), t, .7, .12, .005);
    if (i === 0 || i === 8) kick(o, t, .35);
    if (i === 12) hat(o, t, .03);
  },
  dance(o, t, i) {
    if (i % 4 === 0) kick(o, t, .95);
    if (i % 4 === 2) hat(o, t, .12);
    if (i === 4 || i === 12) snare(o, t, .3);
    if (i % 4 === 2) osc(lp(o, 700), 'sawtooth', mtof(33), t, .12, .34, .002);   // the offbeat bass
    const stab = { 0: 1, 3: 1, 6: 1, 10: 1 };
    if (stab[i]) { const f = lp(o, 2600); [69, 72, 76].forEach((m) => osc(f, 'square', mtof(m), t, .13, .05, .002)); }
  },
};

function stopSong(fade = .18) {
  clearInterval(timer); timer = 0;
  if (loopSrc) { try { loopSrc.g.gain.setTargetAtTime(0, ac.currentTime, fade / 3); loopSrc.s.stop(ac.currentTime + fade + .1); } catch {} loopSrc = null; }
  if (ac && cur) { const out = cur.out; out.gain.setTargetAtTime(0, ac.currentTime, fade / 3); setTimeout(() => out.disconnect(), 600); }   // the old song's tail dies out
  cur = null;
}
async function playSong(s) {
  await boot(); stopSong();
  const out = ac.createGain(); out.connect(master); cur = { id: s.id, out };
  if (s.file) {
    if (!loopBuf[s.id]) loopBuf[s.id] = await fetch('sfx/' + encodeURIComponent(s.file) + '.mp3').then((r) => r.arrayBuffer()).then((b) => ac.decodeAudioData(b));
    if (!cur || cur.out !== out) return;   // another orb was tapped while it loaded
    const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = loopBuf[s.id]; src.loop = true; g.gain.value = 1; src.connect(g); g.connect(out); src.start(); loopSrc = { s: src, g };
    return;
  }
  const spb = 60 / s.bpm / 4; step = 0; nextT = ac.currentTime + .06; GROOVES.dream.bar = 0;
  const tick = () => { while (cur && cur.out === out && nextT < ac.currentTime + .2) { GROOVES[s.id](out, nextT, step % 16, spb); nextT += spb * (s.id === 'lofi' && step % 2 ? 1.18 : s.id === 'lofi' ? .82 : 1); step++; } };
  tick(); timer = setInterval(tick, 50);
}

/* ---------- the orbs ---------- */
const orbsEl = $('#orbs');
SONGS.forEach((s, n) => {
  const w = document.createElement('div'); w.className = 'orbw';
  w.innerHTML = `<button type="button" class="orb" style="--c:${s.c};--d:${-n * .8}s" aria-label="${s.name}"><i class="ring"></i><i class="ring"></i><i class="core"></i><i class="sheen"></i><span class="lab">${s.name}</span></button>`;
  const b = w.firstChild; b.onclick = () => pickOrb(s, b);
  orbsEl.append(w);
});
let chosen = null;
function pickOrb(s, b) {
  const was = b.classList.contains('on');
  document.querySelectorAll('.orb').forEach((o) => { o.classList.remove('on'); o.style.setProperty('--lvl', 0); o.style.setProperty('--bass', 0); o.style.setProperty('--mid', 0); o.style.setProperty('--hi', 0); });
  if (was) { stopSong(); chosen = null; orbsEl.classList.remove('orbs-playing'); $('#sub1').textContent = 'Tap an aura. Find your sound.'; $('#next1').disabled = true; return; }
  b.classList.add('on'); orbsEl.classList.add('orbs-playing'); chosen = s;
  $('#sub1').textContent = s.sub; $('#next1').disabled = false; playSong(s);
}
// the orb dances on the music: bass → size and glow, mids → the shape wobbles, highs → the sheen
function frame() {
  const on = document.querySelector('.orb.on');
  if (on && an) {
    an.getByteFrequencyData(fbuf);
    const avg = (a, b) => { let x = 0; for (let i = a; i < b; i++) x += fbuf[i]; return x / (b - a) / 255; };
    const bass = Math.min(1, avg(1, 6) * 1.25), mid = Math.min(1, avg(6, 28) * 1.8), hi = Math.min(1, avg(28, 100) * 3.5), lvl = Math.min(1, (bass + mid + hi) / 2);
    on.style.setProperty('--bass', bass.toFixed(3)); on.style.setProperty('--mid', mid.toFixed(3)); on.style.setProperty('--hi', hi.toFixed(3)); on.style.setProperty('--lvl', lvl.toFixed(3));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

$('#songs').onclick = () => toast('Coming soon');

/* ---------- page 2 ---------- */
const CHARS = [
  { id: 'justin', name: 'Justin', tag: 'The charmer', img: 'chars/justin/explaining.webp', bg: '#b3261e' },
  { id: 'kai', name: 'Kai', tag: 'The loyal one', img: 'chars/kai/explaining.webp', bg: '#2c6fb3' },
  { id: 'lily', name: 'Lily', tag: 'The wildcard', img: 'chars/lily/smile.png', bg: '#8a2b4f' },
];
let who = null;
const charsEl = $('#chars');
CHARS.forEach((c) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'ch'; b.style.setProperty('--bg', c.bg);
  b.innerHTML = `<img src="${c.img}" alt=""><small>${c.tag}</small><b>${c.name}</b>`;
  b.onclick = () => { who = c; charsEl.classList.add('pick'); charsEl.querySelectorAll('.ch').forEach((x) => x.classList.toggle('on', x === b)); $('#next2').disabled = false; };
  charsEl.append(b);
});
$('#mine').onclick = () => toast('Character maker: coming soon');

/* ---------- the flow ---------- */
const go = (n) => {
  $('#p1').classList.toggle('out', n === 2); $('#p2').classList.toggle('next', n === 1);
  document.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k < n));
};
$('#next1').onclick = () => go(2);
$('#next2').onclick = () => {
  stopSong(.6);
  $('#doneT').textContent = `Welcome, ${who.name}.`; $('#doneP').textContent = `Profile: ${chosen ? chosen.name : 'no sound'} · fake onboarding, nothing saved.`;
  $('#done').classList.add('show');
};
$('#again').onclick = () => {
  $('#done').classList.remove('show'); who = null; chosen = null; stopSong(.1);
  document.querySelectorAll('.orb').forEach((o) => o.classList.remove('on')); orbsEl.classList.remove('orbs-playing');
  charsEl.classList.remove('pick'); charsEl.querySelectorAll('.ch').forEach((x) => x.classList.remove('on'));
  $('#next1').disabled = true; $('#next2').disabled = true; $('#sub1').textContent = 'Tap an aura. Find your sound.'; go(1);
};
</script>
</body>
</html>
