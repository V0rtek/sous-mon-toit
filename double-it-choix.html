<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double It · choice sync test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Yeseva+One&display=swap">
<style>
/* Test bench for a choice in Double It. The 4 loops play 1 → 2 → 3 → 4. "Choice appears" starts the waiting effect over 5 s:
   half-time (drops to half speed in the first 1.25 s), muffle (low-pass closes), a little hush. If the player takes too long
   (TOO_LONG after the choice appears) the reverse cinematic boom (sfx/reverse cinematic boom.mp3, slowed to 80% so the rise is ~6 s, louder as it swells, the beat ducked under it) swells under it, and on its hit (the drop) the choice is made for the player. Picking A/B kills it all and
   the next level starts from its first bar right away (no waiting for the bar line). */
:root { --ui: 'Nunito', system-ui, sans-serif; --display: 'Yeseva One', Georgia, serif; --c: #ff9f0a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #0b0a0f; color: #f5f5f7; font-family: var(--ui); }
header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: rgba(11,10,15,.94); border-bottom: 1px solid #2c2c2e; }
header h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; margin-right: auto; }
header a, header button { color: #8e8e93; text-decoration: none; font-weight: 800; font-size: 14px; background: none; border: 0; cursor: pointer; font-family: inherit; }
main { max-width: 520px; margin: 0 auto; padding: 22px 20px 60px; display: grid; gap: 14px; }
.panel { border-radius: 16px; padding: 16px; background: #17161c; border-left: 6px solid var(--c); display: grid; gap: 10px; }
.n { font-size: 11px; font-weight: 900; color: var(--c); letter-spacing: .1em; }
p { margin: 0; font-size: 13.5px; line-height: 1.45; color: #aeaeb2; }
.pips { display: flex; gap: 6px; }
.pips i { flex: 1; text-align: center; font-style: normal; font-size: 12px; font-weight: 900; color: #8e8e93; background: #2a2931; border-radius: 6px; padding: 9px 0; transition: background .2s, color .2s; }
.pips i.on { background: var(--c); color: #000; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 120px; font: inherit; font-size: 14px; font-weight: 900; color: #000; background: var(--c); border: 0; border-radius: 10px; padding: 14px 10px; cursor: pointer; }
.btn.alt { color: #f5f5f7; background: #2a2931; }
.btn:disabled { opacity: .3; cursor: default; }
.choice { display: flex; gap: 8px; }
.choice .btn { background: #5e5ce6; color: #fff; }
.choice .btn + .btn { background: #ff375f; }
.hint { font-size: 12px; font-weight: 800; color: var(--c); letter-spacing: .04em; min-height: 1.3em; }
.meter { height: 8px; border-radius: 4px; background: #2a2931; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--c); }
</style>
</head>
<body>
<header><h1>Double It · choice sync</h1><button type="button" id="stop">Stop</button><a href="double-it.html">‹ Double It</a></header>
<main>
  <div class="panel">
    <span class="n">HALF-TIME + MUFFLE + HUSH · TENSION RISES IF YOU TAKE TOO LONG</span>
    <div class="pips" id="pips"><i>1</i><i>2</i><i>3</i><i>4</i></div>
    <div class="meter"><i id="fx"></i></div>
    <div class="hint" id="hint"></div>
    <div class="row">
      <button type="button" class="btn" id="go">▶ Start level 1</button>
      <button type="button" class="btn alt" id="ask" disabled>❓ Choice appears</button>
    </div>
    <div class="choice"><button type="button" class="btn" id="a" disabled>A</button><button type="button" class="btn" id="b" disabled>B</button></div>
    <p>Pick right away, then try again and wait about 14 s: after ~7 s the reverse boom starts a ~6 s swell and the drop picks for you.</p>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const LEVELS = ['double it loop 1 intro', 'double it loop 2 drop', 'double it loop 3 drop2', 'double it loop 4 peak'], TENSION = 'reverse cinematic boom';
const BAR = 60 / 140 * 4, LOOP = BAR * 8;
let fxStart = 0;
const RAMP = 5, TOO_LONG = 7, BOOM_AT = 4.8, BOOM_RATE = .8;   // seconds: effect ramp, delay before the reverse boom starts; the boom's hit is 4.8 s into it. The file is quiet for its first ~2 s (-30 dB) and only loud in the last second, and slowing it drops its pitch: .5 made it inaudible, so .8 (rise ~6 s) with a gain boost and the beat ducked under it
const DROP = BOOM_AT / BOOM_RATE;   // the rise lasts this long; its hit (the drop) is when the choice is made for the player
const FX = { rate: .5, lp: 500, vol: .7, snap: .25, tension: 2.2, duck: .3 };   // half speed in the first quarter of the ramp, muffled cutoff (Hz), hush gain, reverse boom peak gain, beat level at the drop
let ac, master, bufs = null, tens = null, cur = null, lv = -1, pending = false, raf;
const load = (n) => fetch('sfx/' + encodeURIComponent(n) + '.mp3').then((r) => r.arrayBuffer()).then((b) => ac.decodeAudioData(b));
async function boot() {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); const c = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = .85; master.connect(c); c.connect(ac.destination); }
  await ac.resume();
  if (!bufs) [bufs, tens] = await Promise.all([Promise.all(LEVELS.map(load)), load(TENSION)]);
}
// one voice = looping source → lowpass → gain; its effect parameters are what the waiting ramp moves
function voice(L, when) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = bufs[L]; s.loop = true; s.loopStart = 0; s.loopEnd = LOOP;
  f.type = 'lowpass'; f.frequency.value = 20000; f.Q.value = .7; g.gain.value = 1;
  s.connect(f); f.connect(g); g.connect(master); s.start(when, 0);
  return { s, f, g, L, t0: when, rise: null };
}
function kill(o, t, keepRise) { if (!o) return; if (o.rise && !keepRise) kill(o.rise, t); clearTimeout(o.auto); o.g.gain.cancelScheduledValues(t); o.g.gain.setValueAtTime(o.g.gain.value, t); o.g.gain.linearRampToValueAtTime(0, t + .03); try { o.s.stop(t + .05); } catch (e) {} }
function level(L, when, keepRise) {   // when = exact audio time (the drop); keepRise lets the boom ring through its hit
  const t = when || ac.currentTime + .03;
  kill(cur, t, keepRise); cur = voice(L, t); lv = L; pending = false; fxStart = 0; paint();
}
// the drop: the choice is made for the player on the boom's hit, the next level (or the end) lands exactly there
function drop(at) {
  if (lv >= 3) { kill(cur, at, true); cur = null; lv = -1; pending = false; paint(); } else level(lv + 1, at, true);
}

function ask() {
  if (!cur || pending) return;
  pending = true; fxStart = ac.currentTime;
  const t = ac.currentTime, e = t + RAMP, { f, g, s } = cur;
  s.playbackRate.cancelScheduledValues(t); s.playbackRate.setValueAtTime(s.playbackRate.value, t);
  s.playbackRate.exponentialRampToValueAtTime(FX.rate, t + RAMP * FX.snap);
  f.frequency.cancelScheduledValues(t); f.frequency.setValueAtTime(20000, t);
  f.frequency.exponentialRampToValueAtTime(FX.lp, e);
  g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(1, t); g.gain.linearRampToValueAtTime(FX.vol, e);
  // too long: the reverse boom swells under the held beat, once (kept on the voice so picking kills it too)
  const r = ac.createBufferSource(), rg = ac.createGain(), at = t + TOO_LONG, hit = at + DROP;
  r.buffer = tens; r.playbackRate.value = BOOM_RATE; rg.gain.setValueAtTime(1, at); rg.gain.linearRampToValueAtTime(FX.tension, hit);   // louder as it swells (the master compressor catches the peak)
  g.gain.setValueAtTime(FX.vol, at); g.gain.linearRampToValueAtTime(FX.duck, hit);   // the beat sinks so the swell is heard
  r.connect(rg); rg.connect(master); r.start(at);
  cur.rise = { s: r, g: rg };
  cur.auto = setTimeout(() => drop(hit), Math.max(0, (hit - ac.currentTime - .3) * 1000));   // scheduled on the audio clock, so it lands on the hit
  paint();
}
function pick() { if (pending) level(lv + 1); }
function stop() { cancelAnimationFrame(raf); if (ac) { kill(cur, ac.currentTime); } cur = null; lv = -1; pending = false; paint(); }
function paint() {
  document.querySelectorAll('#pips i').forEach((p, k) => p.classList.toggle('on', k <= lv));
  $('#go').textContent = lv < 0 ? '▶ Start level 1' : '↺ Restart level 1';
  $('#ask').disabled = !cur || pending || lv >= 3;
  $('#a').disabled = $('#b').disabled = !pending;
  $('#a').textContent = lv >= 3 ? 'A · the end' : 'A';
  $('#b').textContent = lv >= 3 ? 'B · the end' : 'B';
  $('#hint').textContent = lv < 0 ? 'Press Start' : pending ? 'Choice waiting… pick, or the drop picks for you' : lv >= 3 ? 'Level 4 is the last: restart to try again' : 'Level ' + (lv + 1) + ' loops. Press "Choice appears"';
  cancelAnimationFrame(raf); const tick = () => { $('#fx').style.width = pending ? Math.min(100, (ac.currentTime - fxStart) / (TOO_LONG + DROP) * 100) + '%' : '0'; raf = requestAnimationFrame(tick); }; tick();
}
$('#go').onclick = async () => { await boot(); level(0); };
$('#ask').onclick = ask;
$('#a').onclick = $('#b').onclick = () => { if (lv >= 3) stop(); else pick(); };
$('#stop').onclick = stop; paint();
</script>
</body>
</html>
