<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unwritten · la télé</title>
<style>
/* The TV mode on one screen: the TV in the middle, a phone on each side, all live (the real game, three pages talking
   through the relay like three devices). The TV gets a room of its own (?tv&room=sim…), each phone joins it with its
   own name (?watch=…&as=Léa), so the two phones of this browser are two players. */
:root { --bg: #07070a; --fg: #f5f5f7; --dim: #8e8e93; --line: #2c2c2e; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif; overflow: hidden; }
main { height: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2.2vw; padding: 3vh 2vw 2vh; }
.col { display: flex; flex-direction: column; align-items: center; gap: 1.2vh; height: 100%; justify-content: center; min-width: 0; }
.lbl { font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.phone { height: min(82vh, 60vw); aspect-ratio: 9 / 19.5; border-radius: 2.6em; padding: .7em; background: #111; box-shadow: 0 0 0 2px var(--line), 0 2em 5em rgba(0,0,0,.7); }
.phone iframe { width: 100%; height: 100%; border: 0; border-radius: 2em; display: block; background: #000; }
.tv { width: 100%; max-height: 78vh; aspect-ratio: 16 / 9; padding: .8vw; border-radius: 1vw; background: #111; box-shadow: 0 0 0 2px var(--line), 0 2em 6em rgba(0,0,0,.8); }
.tv iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
.stand { width: 18%; height: 1.2vh; border-radius: 0 0 .6vw .6vw; background: #1c1c1e; margin-top: -1.2vh; }
.bar { display: flex; gap: .8em; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 13px; color: var(--dim); }
.bar button, .bar a { font: inherit; font-weight: 700; color: var(--fg); background: #1c1c1e; border: 0; border-radius: 2em; padding: .55em 1.1em; cursor: pointer; text-decoration: none; }
.bar button:hover, .bar a:hover { background: #2c2c2e; }
#start { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(0,0,0,.72); cursor: pointer; text-align: center; }
#start[hidden] { display: none; }
#start b { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%; background: #fff; color: #000; font-size: 40px; padding-left: 6px; }
#start span { font-size: 15px; color: #d1d1d6; }
#pick { display: none; }
/* on a phone: everything on this phone. The TV on top, one player's phone below (Léa | Kev); it switches by itself to
   whoever has a choice to make */
@media (max-width: 760px), (max-aspect-ratio: 1/1) {
  main { height: 100dvh; display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 8px max(8px, env(safe-area-inset-bottom)); }
  .col.mid { order: -1; height: auto; flex: none; gap: 6px; align-items: stretch; }
  .col.mid .lbl, .stand { display: none; }
  .tv { max-height: none; padding: 3px; border-radius: 8px; }
  .bar { position: fixed; top: 10px; right: 10px; z-index: 3; }
  .bar button, .bar a { padding: .35em .8em; background: rgba(28,28,30,.85); }
  #pick { display: flex; flex: none; order: -1; justify-content: center; gap: 6px; }
  #pick button { font: inherit; font-size: 15px; font-weight: 800; flex: 1; max-width: 180px; padding: 9px 0; border: 0; border-radius: 99px; background: #1c1c1e; color: var(--dim); cursor: pointer; position: relative; }
  #pick button.on { background: #f5f5f7; color: #000; }
  #pick button.both { flex: 0 0 48px; display: grid; place-items: center; }
  #pick button.both svg { width: 20px; height: 20px; }
  /* both phones side by side, under the TV */
  main.both { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
  main.both .col.mid, main.both #pick { grid-column: 1 / -1; }
  main.both .col[data-p] { display: flex; }
  #pick button.turn::after { content: ''; position: absolute; right: 14px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #ffd60a; animation: pulse 1s infinite; }
  .col:not(.mid) { display: none; flex: 1; min-height: 0; height: auto; }
  .col.show { display: flex; }
  .col:not(.mid) .lbl { display: none; }
  .phone { height: 100%; width: auto; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 1.4em; padding: .35em; }
  .phone iframe { border-radius: 1.1em; }
}
@keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<main>
  <div class="col show" data-p="1"><div class="lbl" id="n1">Cell 1</div><div class="phone"><iframe id="p1" title="Cell 1" allow="autoplay; screen-wake-lock"></iframe></div></div>
  <div class="col mid">
    <div class="lbl"><span id="code"></span></div>
    <div class="tv"><iframe id="tv" title="La télé" allow="autoplay; fullscreen; screen-wake-lock"></iframe></div><div class="stand"></div>
    <div class="bar"><button type="button" id="again">↻</button><a href="index.html">‹</a></div>
  </div>
  <div id="pick"><button type="button" class="on" data-p="1"></button><button type="button" class="both" data-p="0" aria-label="Les deux"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg></button><button type="button" data-p="2"></button></div>
  <div class="col" data-p="2"><div class="lbl" id="n2">Cell 2</div><div class="phone"><iframe id="p2" title="Cell 2" allow="autoplay; screen-wake-lock"></iframe></div></div>
</main>
<div id="start"><div><b>▶</b></div></div>
<script>
const $ = (s) => document.querySelector(s);
const room = 'tv' + Math.random().toString(36).slice(2, 6).padEnd(4, '0');
const names = ['Léa', 'Kev'];
$('#code').textContent = room.toUpperCase();
names.forEach((n, i) => { $('#n' + (i + 1)).textContent = n; $(`#pick [data-p="${i + 1}"]`).textContent = n; });
// on a phone, one player at a time: a tap on a name, or by itself when it's someone's turn to choose
let shown = 1, auto = true, was = [false, false];
function showP(k) {   // 0 = both, side by side
  shown = k; $('main').classList.toggle('both', k === 0);
  document.querySelectorAll('.col[data-p]').forEach((c) => c.classList.toggle('show', !k || +c.dataset.p === k));
  document.querySelectorAll('#pick button').forEach((b) => b.classList.toggle('on', +b.dataset.p === k));
}
document.querySelectorAll('#pick button').forEach((b) => b.onclick = () => showP(+b.dataset.p));
setInterval(() => {
  const turn = [1, 2].map((k) => { try { return $('#p' + k).contentDocument.body.classList.contains('choosing'); } catch { return false; } });
  turn.forEach((t, i) => { $(`#pick [data-p="${i + 1}"]`).classList.toggle('turn', t); if (t && !was[i] && auto && shown) showP(i + 1); });
  was = turn;
}, 300);
// the TV first (it opens the room), the phones a moment later (they'd wait for it anyway)
function go() {
  $('#start').hidden = true;
  $('#tv').src = `index.html?tv&room=${room}`;
  setTimeout(() => names.forEach((n, i) => { $('#p' + (i + 1)).src = `index.html?watch=${room}&as=${encodeURIComponent(n)}`; }), 1200);
}
$('#start').onclick = go;
$('#again').onclick = () => location.reload();
</script>
</body>
</html>
