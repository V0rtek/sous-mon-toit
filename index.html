<body>
<title>Sous mon toit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,800;1,700;1,900&family=Yeseva+One&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one 9:16 phone stage, centred on black. 1em inside the stage = 1% of its height, so it scales as a whole.
   Inside, one "world" in decor pixels (photo + people + foreground); the camera is a transform on it. */
:root {
  --night: #0b0a0f;
  --paper: #fffdf9;
  --ink: #1d1a24;
  --rim: #cdbdf0;
  --choice: #34516d;
  --choice-hi: #46698b;
  --rose: #e2557a;
  --ui: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --display: 'Yeseva One', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--night); overflow: hidden; }
[hidden] { display: none !important; }
body { font-family: var(--ui); color: var(--ink); -webkit-tap-highlight-color: transparent; user-select: none; }
#stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #1a1620; cursor: pointer; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world > * { position: absolute; }
#bgimg { left: 0; top: 0; display: block; }
.actor img { width: 100%; height: 100%; display: block; }
.actor.talk { animation: talk .38s ease-out; }
@keyframes talk { 40% { transform: translateY(-1.5%); } }
.actor.pop img { animation: pop .22s ease-out; }
@keyframes pop { from { opacity: .55; } }
#shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,.18), transparent 22%, transparent 60%, rgba(0,0,0,.28)); }

#ui { position: absolute; left: 7%; right: 7%; top: 53%; display: flex; flex-direction: column; gap: 1.4em; }
#bubble { position: relative; background: var(--paper); border: .3em solid var(--rim); border-radius: 2em; padding: 2.4em 2.2em 1.9em; box-shadow: 0 .6em 1.6em rgba(0,0,0,.35); }
#bubble.narr { background: rgba(22,18,30,.9); border-color: rgba(255,255,255,.14); color: #f4eefc; padding-top: 1.8em; }
#bubble.narr #text { font-style: italic; font-weight: 600; text-align: center; }
#bubble.think { border-style: dashed; background: #f6f2ff; }
#bubble.think #text, #bubble.whisper #text { font-style: italic; }
#bubble.whisper #text { font-size: 2.1em; }
#tag { position: absolute; left: 1.6em; top: -1.9em; padding: .55em 1.3em; border-radius: 1em; color: #fff; font-weight: 900; font-style: italic; font-size: 2em; letter-spacing: .04em; text-transform: uppercase; line-height: 1; box-shadow: 0 .2em .5em rgba(0,0,0,.25); }
#tag small { font-size: .62em; font-weight: 700; letter-spacing: .02em; text-transform: none; opacity: .85; margin-left: .4em; }
#text { font-size: 2.35em; line-height: 1.32; font-weight: 600; min-height: 1.32em; }
#tail { position: absolute; top: -1.7em; width: 0; height: 0; margin-left: -1.1em; border-left: 1.1em solid transparent; border-right: 1.1em solid transparent; border-bottom: 1.8em solid var(--rim); }
#tail::after { content: ""; position: absolute; left: -.75em; top: .45em; border-left: .75em solid transparent; border-right: .75em solid transparent; border-bottom: 1.3em solid var(--paper); }
#choices { display: flex; flex-direction: column; gap: 1.1em; }
#choices button { font: inherit; font-size: 2.3em; font-weight: 800; color: #fff; text-align: left; background: var(--choice); border: 0; border-radius: 1.4em; padding: .85em 1.2em; cursor: pointer; box-shadow: 0 .25em .7em rgba(0,0,0,.3); animation: rise .28s ease-out backwards; }
#choices button:nth-child(2) { animation-delay: .06s; }
#choices button:nth-child(3) { animation-delay: .12s; }
#choices button:hover, #choices button:focus-visible { background: var(--choice-hi); outline: none; }
#choices button:focus-visible { box-shadow: 0 0 0 .2em #fff; }
@keyframes rise { from { opacity: 0; transform: translateY(1em); } }

#caption { position: absolute; left: 5%; top: 4%; padding: .7em 1.4em; border-radius: 1em; background: rgba(15,12,20,.72); color: #fff; font-size: 1.9em; font-weight: 800; letter-spacing: .02em; opacity: 0; transition: opacity .6s; pointer-events: none; }
#caption.on { opacity: 1; }
#hint { position: absolute; left: 0; right: 0; bottom: 3.5%; text-align: center; color: rgba(255,255,255,.85); font-size: 1.8em; font-weight: 800; text-shadow: 0 .1em .4em rgba(0,0,0,.6); pointer-events: none; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
#black { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 1s; }

/* full-screen cards: cover, Isa's look, end */
.card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 7% 9%; color: #fff; cursor: default; background: #000; overflow: hidden; }
.card .art { position: absolute; inset: 0; background-size: cover; background-position: 62% center; filter: brightness(.55) saturate(1.1); }
.card .hero { position: absolute; right: -6%; bottom: 21%; height: 74%; filter: drop-shadow(0 1em 2em rgba(0,0,0,.6)); }
.card .veil { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,8,14,0) 30%, rgba(10,8,14,.92) 72%); }
.card > *:not(.art):not(.veil):not(.hero) { position: relative; }
.kicker { font-size: 1.8em; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #ffb3c6; }
.title { font-family: var(--display); font-size: 7.4em; line-height: .95; margin: .12em 0 .25em; text-wrap: balance; }
.lede { font-size: 2.2em; line-height: 1.35; font-weight: 600; color: #e9e2f2; margin: 0 0 1.6em; max-width: 26em; }
.field { display: flex; flex-direction: column; gap: .7em; margin-bottom: 1.6em; }
.field label { font-size: 1.8em; font-weight: 800; color: #cfc6dc; }
.field input { font: inherit; font-size: 2.6em; font-weight: 800; padding: .6em .8em; border-radius: .7em; border: .12em solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; outline: none; user-select: text; }
.field input:focus { border-color: #ffb3c6; }
.go { display: block; width: 100%; font: inherit; font-size: 2.6em; font-weight: 900; padding: .8em; border-radius: 1.1em; border: 0; background: var(--rose); color: #fff; cursor: pointer; box-shadow: 0 .3em 1em rgba(226,85,122,.45); }
.go:hover, .go:focus-visible { filter: brightness(1.08); outline: none; }
.go:focus-visible { box-shadow: 0 0 0 .2em #fff; }
.looks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2em; margin: 1.2em 0 2em; }
.looks button { font: inherit; background: rgba(255,255,255,.07); border: .25em solid transparent; border-radius: 1.4em; padding: 1em .4em .8em; cursor: pointer; color: #fff; display: flex; flex-direction: column; align-items: center; gap: .6em; }
.looks button img { height: 30em; max-width: 100%; object-fit: contain; }
.looks button span { font-size: 1.9em; font-weight: 800; }
.looks button[aria-pressed="true"] { border-color: var(--rose); background: rgba(226,85,122,.18); }
.picks { list-style: none; padding: 0; margin: 0 0 2em; display: flex; flex-direction: column; gap: .7em; font-size: 1.9em; color: #ddd3ea; }
.picks b { color: #fff; }
.picks i { color: #ffb3c6; font-style: normal; font-weight: 800; }
.credits { font-size: 1.3em; color: #9c93aa; margin: 1.2em 0 0; }
/* menu screens (name, home, lobby, gallery): black, system font. Home = 4 tiles; Test 2 is empty for now */
.menu { justify-content: center; padding: 0 7%; font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif; color: #f5f5f7; }
.ask { display: flex; flex-direction: column; gap: 2em; }
.ask input { font: inherit; font-size: 3em; font-weight: 600; padding: .7em .9em; border-radius: .8em; border: 0; background: #1c1c1e; color: #f5f5f7; outline: none; user-select: text; }
.ask input::placeholder { color: #86868b; }
.pill { font: inherit; font-size: 2.6em; font-weight: 600; padding: .8em; border-radius: 2em; border: 0; background: #f5f5f7; color: #000; cursor: pointer; }
.names { text-align: center; }
.names div { font-size: 4.4em; font-weight: 600; letter-spacing: -.02em; }
.names div + div { color: #86868b; }
#wait { background: #fff; color: #1d1d1f; padding: 0 6%; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 2em; }
.seats button { font: inherit; color: inherit; background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 1.6em; cursor: pointer; }
.seats .who { font-size: 2.6em; font-weight: 600; min-height: 1.3em; }
.seats .dot { width: 3.6em; height: 3.6em; border-radius: 50%; background: #ff3b30; transition: background .2s; }
.seats .on .dot { background: #34c759; }
.seats img { height: 44em; max-width: 100%; object-fit: contain; }
#gallery, #charView, #newChar { justify-content: flex-start; padding: 13em 5% 6em; overflow-y: auto; }
.prompt { background: #1c1c1e; border-radius: 2em; padding: 2em 9em 2em 2.2em; }
.prompt p { margin: 0; font-size: 1.8em; line-height: 1.4; color: #c7c7cc; white-space: pre-wrap; user-select: text; }
.prompt button { position: absolute; top: 1.4em; right: 1.4em; font: inherit; width: 6em; height: 6em; border-radius: 50%; border: 0; background: #2c2c2e; display: grid; place-items: center; cursor: pointer; padding: 0; }
.prompt button svg { width: 2.8em; height: 2.8em; }
.prompt button .ok, .prompt button.done .cp { display: none; }
.prompt button.done .ok { display: block; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4em; }
.grid3 > * { font: inherit; background: #1c1c1e; border: 0; border-radius: 2em; padding: 1.4em 1em 1.2em; color: #f5f5f7; display: flex; flex-direction: column; align-items: center; gap: .8em; cursor: pointer; }
.grid3 img { height: 22em; max-width: 100%; object-fit: contain; }
.grid3 span { font-size: 1.7em; font-weight: 600; }
.grid3 .add { justify-content: center; min-height: 27em; }
.grid3 .add span { font-size: 7em; font-weight: 300; color: #86868b; }
#charView h2 { font-size: 4.4em; font-weight: 600; letter-spacing: -.02em; margin: 0 0 .6em; }
.refs img { display: block; width: 100%; border-radius: 2em; margin-top: 3em; }
.from { display: flex; flex-direction: column; gap: 1em; margin-bottom: 3em; }
.from span { font-size: 1.8em; font-weight: 600; color: #86868b; }
.from img { display: block; width: 62%; border-radius: 2em; }
#poseCard { position: absolute; inset: 0; z-index: 40; background: rgba(8,6,12,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2em; cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif; }
#poseCard img { height: 76%; max-width: 90%; object-fit: contain; }
#poseCard span { font-size: 2.4em; font-weight: 600; color: #f5f5f7; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 2em; }
.tiles > * { font: inherit; aspect-ratio: 1; box-sizing: border-box; display: flex; align-items: flex-start; padding: 2.4em; border: 0; border-radius: 2.6em; background: #1c1c1e; color: #f5f5f7; text-decoration: none; text-align: left; cursor: pointer; }
.tiles span { font-size: 2.6em; font-weight: 600; letter-spacing: -.01em; }
.tiles .off { opacity: .4; cursor: default; }
.tiles > *:focus-visible { outline: .25em solid #fff; }
#back { position: absolute; top: 2.2%; left: 4%; z-index: 30; font: inherit; width: 8em; height: 8em; border: 0; border-radius: 50%; background: rgba(15,12,20,.6); display: grid; place-items: center; cursor: pointer; padding: 0; }
#back svg { width: 3.6em; height: 3.6em; }
#back:focus-visible, #galBtn:focus-visible { outline: .25em solid #fff; }
#galBtn { position: absolute; top: 2.2%; left: 4%; z-index: 30; font: inherit; width: 8em; height: 8em; border: 0; border-radius: 50%; background: rgba(255,255,255,.08); display: grid; place-items: center; cursor: pointer; padding: 0; }
#galBtn svg { width: 3.8em; height: 3.8em; }
/* the QR, the spectator count and the gallery live in the menu only */
body:not(.home) #qrBtn, body:not(.home) #eyes, body:not(.home) #galBtn { display: none !important; }
/* two players: the one whose turn it is not waits on the last shot */
#waitOther { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); z-index: 20; padding: .7em 1.4em; border-radius: 2em; background: rgba(15,12,20,.75); color: #fff; font-size: 1.9em; font-weight: 800; white-space: nowrap; pointer-events: none; }
#waitOther i { font-style: normal; animation: blink 1.2s infinite; }
#waitOther i:nth-child(3) { animation-delay: .2s; }
#waitOther i:nth-child(4) { animation-delay: .4s; }
body.watch #choices button.mine { pointer-events: auto; }
/* live: the QR to let someone watch, and the spectator's view (same screen, nothing to press) */
#qrBtn { position: absolute; top: 2.2%; right: 4%; z-index: 30; font: inherit; width: 8em; height: 8em; border: 0; border-radius: 50%; background: rgba(15,12,20,.6); display: grid; place-items: center; cursor: pointer; padding: 0; }
#qrBtn svg { width: 4em; height: 4em; }
#qrBtn:focus-visible { outline: .25em solid #fff; }
#eyes { position: absolute; top: calc(2.2% + 1.2em); right: calc(4% + 9.2em); z-index: 30; height: 5.6em; padding: 0 1.8em; border-radius: 2.8em; background: rgba(15,12,20,.6); color: #fff; display: flex; align-items: center; gap: .8em; pointer-events: none; }
#eyes svg { width: 2.8em; height: 2.8em; }
#eyes span { font-size: 2.6em; font-weight: 800; }
#qrCard { position: absolute; inset: 0; z-index: 40; background: rgba(8,6,12,.92); display: grid; place-items: center; cursor: pointer; }
#qrBox { width: 50%; aspect-ratio: 1; background: #fff; border-radius: 1.8em; padding: 3%; box-sizing: border-box; }
#qrBox svg { width: 100%; height: 100%; display: block; }
body.watch #stage { cursor: default; }
body.watch #start, body.watch #again, body.watch #lookGo, body.watch #hint { display: none !important; }
body.watch #choices button, body.watch .looks button { pointer-events: none; }
#choices button.picked { background: var(--choice-hi); box-shadow: 0 0 0 .2em #fff; }
@media (prefers-reduced-motion: reduce) { .actor.talk, .actor.pop img, #choices button, #hint { animation: none; } }
</style>

<script>
const $ = (s) => document.querySelector(s);
const stage = $('#stage'), world = $('#world'), bgImg = $('#bgimg'), castEl = $('#cast'), frontEl = $('#front'),
  bubble = $('#bubble'), tagEl = $('#tag'), textEl = $('#text'), tail = $('#tail'), choicesEl = $('#choices'),
  black = $('#black'), caption = $('#caption'), hint = $('#hint');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// camera height per framing, in standing heights of the framed people (it grows if they do not fit side by side),
// and the space left above the highest head (share of the frame)
const FRAME = { one: [0.86, .08], close: [0.55, .06], two: [0.9, .1], three: [1.0, .12] };
const BLUR = { wide: 0, three: .6, two: 1.2, one: 2, close: 3 };   // decor blur on screen, x stage height / 800

let W = 0, H = 0, q = [], waiting = null, typing = null, firstLine = true, FAST = false, run = 0;
let sc = null, actors = {}, camNow = null;
// story: 't1' (chapter 1) or 'play' (2 players); f = what the choices decided (read by the story's `when` steps)
const STORIES = { t1: STORY, play: PLAY };
// seats = who took each Playthrough character in the waiting room: {pa: {id, n}, pb: {id, n}}
const state = { name: 'Justin', seats: {}, story: 't1', f: {}, isa: ISA_LOOKS[0].sprite, picks: [] };
const sleep = (ms) => new Promise((r) => setTimeout(r, FAST ? 0 : REDUCED ? Math.min(ms, 50) : ms));
const seatName = (k) => (state.seats[k] ? state.seats[k].n : '');
// {N} = the host, {PA} / {PB} = whoever took that character, any other {WORD} comes from the story (WORDS)
const fill = (t) => t.replaceAll('{N}', state.name).replace(/\{P([AB])\}/g, (m, k) => seatName('p' + k.toLowerCase()))
  .replace(/\{([A-Z]+)\}/g, (m, k) => (window.WORDS && WORDS[k] ? WORDS[k](state.f) : m));
const spriteOf = (id) => (id === 'isa' ? state.isa : CAST[id].sprite);
const poseSrc = (id, pose) => `chars/${spriteOf(id)}/${pose}.webp`;

function fit() {
  const bw = document.body.clientWidth, bh = document.body.clientHeight;
  H = Math.min(bh, bw * 16 / 9); W = H * 9 / 16;
  Object.assign(stage.style, { width: W + 'px', height: H + 'px', fontSize: H / 100 + 'px' });
  if (camNow) applyCam(camNow, 0);
}

// ---- people, in decor pixels ----
function box(a) {
  const sp = SPRITES[spriteOf(a.id)], p = sp.poses[a.pose];
  const ih = p[1] / sp.refH * a.h * (CAST[a.id].scale || 1);
  return { w: p[0] / p[1] * ih, h: ih };
}
function placeActor(a) {
  const b = box(a);
  Object.assign(a.el.style, { width: b.w + 'px', height: b.h + 'px', left: a.x - b.w / 2 + 'px', top: a.feet - b.h + 'px', zIndex: Math.round(a.feet) });
  const nat = FACE[spriteOf(a.id)][a.pose];
  a.el.firstChild.style.transform = a.face && nat !== 'f' && a.face !== nat ? 'scaleX(-1)' : '';
}
function enter(id, pose) {
  const [x, feet, h] = sc.spots[id];
  const a = actors[id] = { id, pose, x, feet, h, face: sc.face[id], el: document.createElement('div') };
  a.el.className = 'actor'; a.el.style.position = 'absolute';
  const img = new Image(); img.alt = ''; img.src = poseSrc(id, pose); a.el.appendChild(img);
  castEl.appendChild(a.el); placeActor(a);
}
function exit(id) { if (actors[id]) { actors[id].el.remove(); delete actors[id]; } }
function setPose(id, pose) {
  const a = actors[id]; if (!a || a.pose === pose) return;
  a.pose = pose; a.el.firstChild.src = poseSrc(id, pose); placeActor(a);
  a.el.classList.remove('pop'); void a.el.offsetWidth; a.el.classList.add('pop');
}
function setFace(f) { for (const [id, d] of Object.entries(f)) if (actors[id]) { actors[id].face = d; placeActor(actors[id]); } }

function setScene(id, cast) {
  sc = SCENES[id]; actors = {}; castEl.innerHTML = ''; frontEl.innerHTML = '';
  const [bw, bh] = sc.size;
  bgImg.src = sc.image; Object.assign(bgImg.style, { width: bw + 'px', height: bh + 'px' });
  Object.assign(world.style, { width: bw + 'px', height: bh + 'px' });
  for (const [who, pose] of Object.entries(cast)) enter(who, pose);
  for (const r of sc.front) {
    const d = document.createElement('div');
    Object.assign(d.style, { position: 'absolute', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px',
      background: r.color, borderRadius: (r.r || 0) + 'px', filter: r.blur ? `blur(${r.blur}px)` : '' });
    frontEl.appendChild(d);
  }
  frontEl.style.zIndex = 5000;
}

// ---- camera: a size + who to frame (or a point for wide shots) ----
function frameOf(c) {
  const [bw, bh] = sc.size;
  let camH, cx, top;
  const who = (c.who || []).map((id) => actors[id]).filter(Boolean);
  if (c.size === 'wide' || !who.length) {
    camH = bh; top = 0;
    const all = Object.values(actors);
    cx = c.at ?? (all.length ? (Math.min(...all.map((a) => a.x)) + Math.max(...all.map((a) => a.x))) / 2 : bw / 2);
  } else {
    const [k, margin] = FRAME[c.size];
    const boxes = who.map((a) => ({ a, b: box(a) }));
    const left = Math.min(...boxes.map(({ a, b }) => a.x - b.w / 2)), right = Math.max(...boxes.map(({ a, b }) => a.x + b.w / 2));
    const tall = Math.max(...who.map((a) => a.h)), head = Math.min(...boxes.map(({ a, b }) => a.feet - b.h));
    camH = Math.min(bh, Math.max(k * tall, (right - left) * 1.08 * 16 / 9));
    cx = (left + right) / 2; top = head - margin * camH;
  }
  if (c.lift !== undefined) top = c.lift;
  const camW = camH * 9 / 16;
  return { camH, left: Math.min(Math.max(0, cx - camW / 2), bw - camW), top: Math.min(Math.max(0, top), bh - camH) };
}
function applyCam(c, ms) {
  camNow = c;
  const f = c.frame || frameOf(c), s = H / f.camH;
  world.style.transition = ms ? `transform ${ms}ms cubic-bezier(.45,0,.25,1)` : 'none';
  world.style.transform = `translate(${-f.left * s}px,${-f.top * s}px) scale(${s})`;
  const blur = (BLUR[c.size] || 0) * H / 800 / s;
  bgImg.style.filter = blur ? `blur(${blur}px)` : 'none';
  camNow.frame = f;
}
function setCam(c, ms = 0) { bubble.hidden = true; choicesEl.hidden = true; applyCam({ ...c, frame: null }, ms); }

// ---- text ----
let typingFull = '';   // the whole line, shown at once when someone taps while it types
function typeText(t) {
  clearInterval(typing); textEl.textContent = ''; typingFull = t;
  if (REDUCED || FAST) { textEl.textContent = t; typing = null; return; }
  let i = 0;
  typing = setInterval(() => { textEl.textContent = t.slice(0, ++i); if (i >= t.length) { clearInterval(typing); typing = null; } }, 13);
}
// a story that stages itself (STORY.gaze): when someone speaks, the others stop their talking gesture and turn to them,
// and the speaker turns to whom they talk to (s.to, else whoever spoke last)
let lastSpeaker = null;
function gaze(s) {
  const sp = actors[s.say];
  if (!sp) return;
  if (!s.whisper) for (const a of Object.values(actors)) {
    if (a === sp) continue;
    if (a.pose === 'explaining') setPose(a.id, 'listen');
    if (a.x !== sp.x) { a.face = sp.x < a.x ? 'l' : 'r'; placeActor(a); }
  }
  const to = actors[s.to || lastSpeaker];
  if (to && to !== sp && to.x !== sp.x) { sp.face = to.x < sp.x ? 'l' : 'r'; placeActor(sp); }
  lastSpeaker = s.say;
}
function line(s) {
  const who = s.say || s.think || null, kind = s.narr ? 'narr' : s.think ? 'think' : s.whisper ? 'whisper' : 'say';
  if (s.say && STORIES[state.story].gaze) gaze(s);
  if (s.say && s.pose) setPose(s.say, s.pose);
  bubble.className = kind;
  tagEl.hidden = !who;
  if (who) {
    tagEl.innerHTML = '';
    tagEl.append(fill(CAST[who].name));
    if (kind !== 'say') { const sm = document.createElement('small'); sm.textContent = kind === 'think' ? 'pense' : 'chuchote'; tagEl.append(sm); }
    tagEl.style.background = CAST[who].color;
  }
  // the tail points at the speaker if the camera sees them
  const a = who && actors[who], f = camNow && camNow.frame;
  const sx = a && f ? (a.x - f.left) * (H / f.camH) / W : -1;
  tail.hidden = kind === 'narr' || sx < .05 || sx > .95;
  if (!tail.hidden) tail.style.left = Math.min(86, Math.max(14, (sx - .07) / .86 * 100)) + '%';
  if (a && kind === 'say') { a.el.classList.remove('talk'); void a.el.offsetWidth; a.el.classList.add('talk'); }
  bubble.hidden = false; choicesEl.hidden = true;
  typeText(fill(s.text || s.narr));
  if (firstLine) { hint.hidden = false; firstLine = false; }
}
let options = null, optionsBy = 'p1';
// each choice belongs to a character (by = its seat; none = the host's, as in chapter 1). If whoever took it left,
// the host makes the choice so the story never gets stuck
const ownerOf = (by) => (by && state.seats[by] ? state.seats[by].id : ROLE === 'host' ? myId : hostId);
const seated = () => Object.values(state.seats).some((s) => s.id === myId);
const mineFor = (by) => { const o = ownerOf(by); return o === myId || (ROLE === 'host' && !watchers.has(o)); };
// a Playthrough player whose turn it is not stays on the shot they were on, with "<name> choisit…" at the bottom
const waitsFor = (by) => state.story === 'play' && seated() && !mineFor(by);
let held = [];   // the steps that lead into the other player's choice: they run once that player has picked
function choose(opts, by) {
  options = opts; optionsBy = by; choicesEl.innerHTML = '';
  const mine = mineFor(by);
  if (waitsFor(by)) { choicesEl.hidden = true; $('#otherName').textContent = seatName(by); $('#waitOther').hidden = false; }
  else choicesEl.hidden = false;
  opts.forEach((o, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = fill(o.t);
    if (mine && ROLE === 'watch') b.classList.add('mine');
    b.onclick = (e) => {
      e.stopPropagation();
      if (!mine || waiting !== 'choice') return;
      if (ROLE === 'host') pickChoice(i);
      else if (!choicesEl.querySelector('.picked')) { b.classList.add('picked'); sendIn('c' + i); }
    };
    choicesEl.appendChild(b);
    if (i === 0 && ROLE === 'host' && mine && matchMedia('(hover: hover)').matches) b.focus({ preventScroll: true });
  });
}
// the pick lights up for a moment on the other phones before the story goes on
function pickChoice(i, afar = false) {
  const o = options && options[i]; if (!o || waiting !== 'choice') return;
  record('c' + i);
  const by = optionsBy;
  const go = () => {
    state.picks.push({ ...o, by }); if (o.set) Object.assign(state.f, o.set);
    choicesEl.hidden = true; $('#waitOther').hidden = true;
    q.unshift(...held, ...o.then); held = []; waiting = null; next();
  };
  if ((ROLE === 'watch' || afar) && !FAST && !choicesEl.hidden && choicesEl.children[i]) { choicesEl.children[i].classList.add('picked'); waiting = 'picked'; setTimeout(go, 450); }
  else go();
}

function fade(dir, ms) {
  bubble.hidden = true;
  black.style.transition = `opacity ${FAST ? 0 : ms}ms`;
  black.style.opacity = dir === 'out' ? 1 : 0;
  return sleep(ms);
}
function showCaption(t) {
  caption.textContent = t; caption.classList.add('on');
  clearTimeout(showCaption.t); showCaption.t = setTimeout(() => caption.classList.remove('on'), 3200);
}
// toes to head: a close shot that starts on the feet and rises to the face
async function reveal(id, ms) {
  setCam({ size: 'close', who: [id] });
  const end = camNow.frame, a = actors[id];
  applyCam({ size: 'close', who: [id], frame: { ...end, top: Math.min(a.feet - end.camH * .92, sc.size[1] - end.camH) } }, 0);
  void world.offsetWidth;
  applyCam({ size: 'close', who: [id], frame: end }, FAST || REDUCED ? 0 : ms);
  await sleep(ms + 250);
}

let lookDone = null;
function selectLook(i) {
  state.isa = ISA_LOOKS[i].sprite;

}
function pickLook(i) {
  if (!lookDone) return;
  selectLook(i);
  const done = lookDone; lookDone = null;
  setTimeout(done, ROLE === 'watch' && !FAST ? 700 : 0);
}
const CUSTOM = {
  isaLook() {
    return new Promise((done) => {
      const card = $('#looks'), list = $('#lookList');
      list.innerHTML = '';
      ISA_LOOKS.forEach((l, i) => {

        b.onclick = (e) => { e.stopPropagation(); if (ROLE === 'host') selectLook(i); };
        list.appendChild(b);
      });
      selectLook(Math.max(0, ISA_LOOKS.findIndex((l) => l.sprite === state.isa)));
      card.hidden = false; bubble.hidden = true;
      lookDone = () => {

        e.stopPropagation();

};

// the end card: chapter 1's own text, or the story's ({end: {kicker, title, lede}}); a 2-player story names who chose what
const END0 = { kicker: $('#endKicker').textContent, title: $('#endTitle').textContent, lede: $('#endLede').textContent };
function endCard(d) {
  const e = typeof d === 'object' ? d : END0, two = state.story === 'play';
  bubble.hidden = true;
  $('#endKicker').textContent = fill(e.kicker || ''); $('#endTitle').textContent = fill(e.title || '');
  $('#endLede').textContent = fill(e.lede || ''); $('#endLede').hidden = !e.lede;
  const ul = $('#picks'); ul.innerHTML = '';
  const head = document.createElement('li'); head.innerHTML = two ? '<b>Vos choix</b>' : '<b>Tes choix</b>'; ul.appendChild(head);

// one story runner at a time: a restart (run++) stops the one still waiting on a fade or a pan
async function next() {
  const r = run;
  const k = q.findIndex((s) => !(s.cam || s.poses || s.face || s.enter || s.exit || s.pan !== undefined));
  if (k > 0 && q[k].choice && waitsFor(q[k].by)) held = q.splice(0, k);
  while (q.length && r === run) {
    const s = q.shift();
    if (s.when) q.unshift(...(s.when(state.f) ? s.then : s.else || []));
    else if (s.set) Object.assign(state.f, s.set);
    else if (s.scene) setScene(s.scene, s.cast);
    else if (s.cam) setCam({ size: s.cam, who: s.who, at: s.at });
    else if (s.pan !== undefined) { setCam({ size: 'wide', at: s.pan }, FAST || REDUCED ? 0 : s.ms); await sleep(s.ms); }
    else if (s.enter) for (const [id, pose] of Object.entries(s.enter)) enter(id, pose);
    else if (s.exit) exit(s.exit);
    else if (s.face) setFace(s.face);
    else if (s.poses) for (const [id, p] of Object.entries(s.poses)) setPose(id, p);
    else if (s.reveal) await reveal(s.reveal, s.ms);
    else if (s.fade) await fade(s.fade, s.ms);
    else if (s.caption) showCaption(s.caption);
    else if (s.wait) await sleep(s.wait);
    else if (s.custom) await CUSTOM[s.custom]();
    else if (s.say || s.narr || s.think) { line(s); waiting = 'click'; return; }
    else if (s.choice) { choose(s.choice, s.by); waiting = 'choice'; return; }
    else if (s.end) { endCard(s.end); return; }
  }
}

function advance() {
  if (ROLE === 'watch') {
    // in the Playthrough the two players move the story; the host checks the tap is for the line it is on
    if (!seated() || state.story !== 'play') return;
    if (typing) { clearInterval(typing); textEl.textContent = typingFull; typing = null; return; }
    if (waiting === 'click' && remote && applied === remote.t.length && sentK !== applied) { sentK = applied; sendIn('a'); }
    return;
  }
  if (typing) { clearInterval(typing); textEl.textContent = typingFull; typing = null; return; }
  if (waiting !== 'click') return;
  record('a'); waiting = null; hint.hidden = true; next();
}
stage.addEventListener('click', (e) => { if (!e.target.closest('.card')) advance(); });
addEventListener('keydown', (e) => {
  if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('input, button')) { e.preventDefault(); advance(); }
});

// ---- screens: name -> home (4 tiles) -> a story (the Playthrough through its waiting room);
// a joiner: name -> lobby -> the host's waiting room / story ----
const SCREENS = ['#who', '#hub', '#lobby', '#wait', '#gallery', '#charView', '#newChar', '#cover', '#end'];
const UP = { '#wait': '#hub', '#gallery': '#hub', '#charView': '#gallery', '#newChar': '#gallery', '#cover': '#hub', '#end': '#hub' };   // where ‹ goes
let screen = '#who';
function show(id) {
  for (const s of SCREENS) $(s).hidden = s !== id;
  screen = id;
  document.body.classList.toggle('home', id === '#hub');
  $('#back').hidden = ROLE !== 'host' || !UP[id];
}
function halt() { run++; q = []; held = []; waiting = null; clearInterval(typing); typing = null; bubble.hidden = true; choicesEl.hidden = true; $('#waitOther').hidden = true; $('#looks').hidden = true; }

function begin(id = state.story) {
  run++; state.story = id; state.f = {}; state.picks = []; state.isa = ISA_LOOKS[0].sprite; waiting = null; lookDone = null;
  held = []; lastSpeaker = null; $('#waitOther').hidden = true;
  firstLine = id === 't1';   // the "tap to continue" hint is chapter 1's; the Playthrough has none
  q = STORIES[id].slice(); black.style.transition = 'none'; black.style.opacity = 1;
  show(null); $('#looks').hidden = true;
  if (id !== 'play') state.seats = {};
  if (ROLE === 'host') { if (waitRoom) announce(false); waitRoom = false; game = Date.now().toString(36); tape = []; share(); }
  next();
}
// leaving a story or the waiting room sends the joiners back to the lobby
function toHub() {
  halt(); show('#hub');
  if (waitRoom) announce(false);
  waitRoom = false; state.seats = {}; game = null; tape = []; share();
}

// ---- Playthrough waiting room: a dot over each character, red = free, green = taken (the name above it).
// Tap a free one to take it (it frees the one you had), tap yours to let it go. Two taken = the story starts ----
let waitRoom = false;   // host: the waiting room is open
function openWait() {
  // another phone's waiting room is open: join it instead of opening a second one
  if (openRoom && openRoom.room !== room && Date.now() - openRoom.t < 30000) { joinRoom(openRoom.room); return; }
  halt(); waitRoom = true; state.seats = {}; game = null; tape = []; renderWait(); share(); announce(true);
}
function renderWait() {
  show('#wait');
  const list = $('#seatList'); list.innerHTML = '';
  for (const k of PLAY_SEATS) {
    const s = state.seats[k], b = document.createElement('button'); b.type = 'button';
    if (s) b.classList.add('on');
    const who = document.createElement('span'); who.className = 'who'; who.textContent = s ? s.n : '';
    const dot = document.createElement('span'); dot.className = 'dot';
    const img = new Image(); img.alt = ''; img.src = `chars/${CAST[k].sprite}/listen.webp`;
    b.append(who, dot, img);
    b.onclick = (e) => { e.stopPropagation(); if (ROLE === 'host') takeSeat(k, myId, state.name); else sendIn('seat', { s: k }); };
    list.appendChild(b);
  }
}
function takeSeat(k, id, n) {
  if (!waitRoom || !PLAY_SEATS.includes(k)) return;
  const s = state.seats[k];
  if (s && s.id === id) delete state.seats[k];
  else if (!s) {
    for (const j of PLAY_SEATS) if (state.seats[j] && state.seats[j].id === id) delete state.seats[j];
    state.seats[k] = { id, n: String(n || 'Kev').slice(0, 16) };
  } else return;
  renderWait(); share();
  clearTimeout(takeSeat.t);
  const full = () => PLAY_SEATS.every((j) => state.seats[j]);
  if (full()) takeSeat.t = setTimeout(() => { if (waitRoom && full()) begin('play'); }, 900);
}

  $('#copy').classList.add('done'); setTimeout(() => $('#copy').classList.remove('done'), 1400);
};

// ---- live: whoever scans the QR in the menu joins. The host's phone runs the story: its state goes to a public MQTT
// relay as one retained message (story + game id + names + waiting-room seats + every tap so far); a joiner replays the
// taps on the same story, so a late joiner catches up. Joiners' taps (a seat, a line, a choice) go to the host, which
// plays them into the tape like its own.
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const WATCH = new URLSearchParams(location.search).get('watch');
const ROLE = WATCH && /^[a-z0-9]{4,12}$/.test(WATCH) ? 'watch' : 'host';
let live = null, room = ROLE === 'watch' ? WATCH : null, game = null, tape = [];
let myName = '', sentK = -1, hostId = null;   // joiner: its name, the last line it asked to move past, the host's id
const myId = (() => {
  const fresh = () => Math.random().toString(36).slice(2, 10);
  try { let c = localStorage.getItem('smt-id'); if (!c) { c = fresh(); localStorage.setItem('smt-id', c); } return c; } catch { return fresh(); }
})();
const topic = () => `sousmontoit/v1/${room}`;
function loadScript(src) {
  return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
}
function roomCode() {
  const fresh = () => Math.random().toString(36).slice(2, 8).padEnd(6, '0');
  try { let c = localStorage.getItem('smt-room'); if (!c) { c = fresh(); localStorage.setItem('smt-room', c); } return c; } catch { return fresh(); }
}
function share() {
  if (ROLE !== 'host' || !live || !live.connected) return;
  const names = [...watchers.values()].map((w) => w.n).filter(Boolean);
  live.publish(topic(), JSON.stringify({ g: game, s: state.story, h: myId, n: state.name, r: names, w: waitRoom ? 'play' : null, seats: state.seats, t: tape }), { retain: true, qos: 1 });
}
function record(ev) { if (ROLE === 'host') { tape.push(ev); share(); } }

// no QR needed for the Playthrough: an open waiting room is announced under sousmontoit/v1/open (refreshed every 10 s,
// cleared when it closes); a phone that taps Playthrough while another one's room is open joins that room
const OPEN = 'sousmontoit/v1/open';
let openRoom = null;   // the last announcement heard: {room, n, t}
function announce(on) {
  if (ROLE !== 'host' || !live || !live.connected) return;
  if (on) live.publish(OPEN, JSON.stringify({ room, n: state.name, t: Date.now() }), { retain: true });
  else if (openRoom && openRoom.room === room) live.publish(OPEN, '', { retain: true });
}
function joinRoom(r) {
  try { sessionStorage.setItem('smt-auto', '1'); } catch { /* private window */ }
  location.href = `${location.pathname}?watch=${r}`;
}

// joiners keep a retained presence under <topic>/w/ ({t: time, n: name, j: joined}, refreshed every 10 s); the broker
// clears it when they drop (will), and the host forgets anyone silent for 35 s (and frees their character in the waiting room)
const watchers = new Map();
let heard = '';
function countEyes() {
  const now = Date.now();
  for (const [id, w] of watchers) if (now - w.t > 35000) watchers.delete(id);
  $('#eyes span').textContent = watchers.size;
  $('#eyes').hidden = !watchers.size;
  let changed = false;
  if (waitRoom) for (const k of PLAY_SEATS) { const s = state.seats[k]; if (s && s.id !== myId && !watchers.has(s.id)) { delete state.seats[k]; changed = true; } }
  if (changed) renderWait();
  const now2 = [...watchers.values()].map((w) => w.n).join('|');
  if (changed || now2 !== heard) { heard = now2; share(); }
}
function fromJoiner(m) {
  if (m.e === 'seat') { const w = watchers.get(m.id); takeSeat(m.s, m.id, (w && w.n) || m.n); return; }
  if (!game || m.g !== game || !Object.values(state.seats).some((s) => s.id === m.id)) return;
  if (m.e === 'a') {
    if (m.k !== tape.length) return;
    if (typing) { clearInterval(typing); textEl.textContent = typingFull; typing = null; }
    if (waiting === 'click') { record('a'); waiting = null; hint.hidden = true; next(); }
  } else if (/^c\d$/.test(m.e) && ownerOf(optionsBy) === m.id) pickChoice(+m.e.slice(1), true);
}
function sendIn(e, more) {
  if (live && live.connected) live.publish(`${topic()}/in`, JSON.stringify({ id: myId, n: myName, g: remote ? remote.g : null, k: applied, e, ...more }), { qos: 1 });
}

async function goLive() {
  if (ROLE === 'host') room = roomCode();
  try { await loadScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'); } catch { return; }
  const seat = `${topic()}/w/${myId}`, joined = Date.now();
  const here = () => { if (live.connected) live.publish(seat, JSON.stringify({ t: Date.now(), n: myName, j: joined }), { retain: true }); };
  live = mqtt.connect(BROKER, { clientId: 'smt-' + Math.random().toString(16).slice(2, 10), reconnectPeriod: 3000, connectTimeout: 8000, keepalive: 20,
    will: ROLE === 'watch' ? { topic: seat, payload: '', retain: true, qos: 0 } : undefined });
  live.on('connect', () => {
    if (ROLE === 'host') { $('#qrBtn').hidden = false; share(); live.subscribe([`${topic()}/w/+`, `${topic()}/in`, OPEN]); if (waitRoom) announce(true); }
    else { live.subscribe(topic(), { qos: 1 }); here(); }
  });
  if (ROLE === 'watch') {
    live.on('message', (t, buf) => { try { follow(JSON.parse(buf.toString())); } catch { /* not ours */ } });
    setInterval(here, 10000);
    addEventListener('pagehide', () => { if (live.connected) live.publish(seat, '', { retain: true }); });
  } else {
    live.on('message', (t, buf, packet) => {
      if (t === OPEN) { try { openRoom = buf.length ? JSON.parse(buf.toString()) : null; } catch { openRoom = null; } return; }
      if (t === `${topic()}/in`) { try { fromJoiner(JSON.parse(buf.toString())); } catch { /* not ours */ } return; }
      const id = t.split('/w/')[1];
      if (!id) return;
      const now = Date.now();
      if (!buf.length) watchers.delete(id);
      else {
        let v = null; try { v = JSON.parse(buf.toString()); } catch { /* not ours */ }
        if (!v || typeof v !== 'object') v = { t: +v };
        // a retained presence may be old: trust its own timestamp; a live refresh is fresh by definition
        watchers.set(id, { t: packet.retain ? Math.min(now, +v.t || 0) : now, n: String(v.n || '').slice(0, 16), j: +v.j || now });
      }
      countEyes();
    });
    setInterval(countEyes, 5000);
    setInterval(() => { if (waitRoom) announce(true); }, 10000);
    addEventListener('pagehide', () => { if (waitRoom) announce(false); });
  }
}

$('#qrBtn').onclick = async (e) => {
  e.stopPropagation();
  if (!window.qrcode) { try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'); } catch { return; } }
  const qr = qrcode(0, 'M'); qr.addData(`${location.origin}${location.pathname}?watch=${room}`); qr.make();
  $('#qrBox').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  $('#qrCard').hidden = false;
};
$('#qrCard').onclick = (e) => { e.stopPropagation(); $('#qrCard').hidden = true; };

// joiner: replay the host's taps in order, each one when the story is ready for it; far behind = no animation
let remote = null, applied = 0, pumping = false;
const until = (ok) => new Promise((r) => { const t = () => (ok() ? r() : setTimeout(t, 40)); t(); });
function follow(msg) {
  hostId = msg && msg.h;
  if (!msg || !msg.g) {
    remote = null;
    if (msg && msg.w === 'play') { if (screen !== '#wait') halt(); state.seats = msg.seats || {}; renderWait(); }
    else toLobby(msg || {});
    return;
  }
  if (!remote || remote.g !== msg.g) {
    remote = msg; applied = 0; sentK = -1;
    state.name = String(msg.n || 'Justin').slice(0, 16); state.seats = msg.seats || {};
    begin(STORIES[msg.s] ? msg.s : 't1');
  } else remote = msg;
  pump();
}
function toLobby(msg) {
  halt(); show('#lobby');
  const box = $('#names'); box.innerHTML = '';
  for (const n of [msg.n, ...(msg.r || [])]) if (n) { const d = document.createElement('div'); d.textContent = n; box.appendChild(d); }
}
async function pump() {
  if (pumping) return;
  pumping = true;
  while (remote && applied < remote.t.length) {
    const g = remote.g, ev = String(remote.t[applied]);
    FAST = remote.t.length - applied > 2;
    await until(() => !remote || remote.g !== g || (ev === 'a' ? waiting === 'click' : ev[0] === 'c' ? waiting === 'choice' : !!lookDone));
    if (!remote || remote.g !== g) break;
    applied++;
    if (ev === 'a') { clearInterval(typing); typing = null; textEl.textContent = typingFull; waiting = null; next(); }
    else if (ev[0] === 'c') pickChoice(+ev.slice(1));
    else if (ev[0] === 'l') pickLook(+ev.slice(1));
  }
  FAST = false; pumping = false;
  if (remote && applied < remote.t.length) pump();
}

// index.html#t40 / #p12 = start chapter 1 / the Playthrough and jump to the 40th / 12th tap (first option on every
// choice), to check a shot without playing
async function skipTo(n, id) {
  const tick = () => new Promise((r) => setTimeout(r, 0));
  FAST = true;
  if (id === 'play') state.seats = { pa: { id: myId, n: state.name }, pb: { id: myId, n: 'Kev' } };   // a jump plays both
  begin(id);
  for (let k = 0; k < n; k++) {
    for (let g = 0; g < 500 && !waiting && $('#looks').hidden && $('#end').hidden; g++) await tick();
    if (!$('#end').hidden) break;
    if (!$('#looks').hidden) { $('#lookGo').click(); continue; }
    if (waiting === 'choice') choicesEl.querySelector('button').click();
    else advance();
  }
  FAST = false;
}

addEventListener('resize', fit);
if (ROLE === 'watch') document.body.classList.add('watch');
let auto = false;
try { auto = ROLE === 'watch' && sessionStorage.getItem('smt-auto') === '1'; sessionStorage.removeItem('smt-auto'); } catch { /* private window */ }
try { $('#whoName').value = localStorage.getItem('smt-name') || ''; } catch { /* private window */ }
fit();
if (ROLE === 'host') goLive();
else if (auto && $('#whoName').value) $('#whoForm .pill').click();
const jump = location.hash.match(/^#([tp])(\d+)$/);
if (jump) skipTo(+jump[2], jump[1] === 'p' ? 'play' : 't1');
// warm the cache so cuts never flash
for (const s of Object.values(SCENES)) new Image().src = s.image;
for (const [id, sp] of Object.entries(SPRITES)) for (const pose of Object.keys(sp.poses)) new Image().src = `chars/${id}/${pose}.webp`;
</script>
