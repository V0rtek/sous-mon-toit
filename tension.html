<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tension music</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Yeseva+One&display=swap">
<style>
/* A tension loop that levels up with the stakes. One note (D, D, D, D) → each click adds a layer → a riser → a boom.
   Everything is synthesized (Web Audio), no files. One loop per story moment: the stakes grow, the music follows. */
:root { --ui: 'Nunito', system-ui, sans-serif; --display: 'Yeseva One', Georgia, serif; --c: #8e8e93; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0a0f; color: #f5f5f7; font-family: var(--ui); }
body { display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid #2c2c2e; }
header h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; margin-right: auto; }
header a { color: #8e8e93; text-decoration: none; font-weight: 800; font-size: 14px; }
main { flex: 1; display: grid; place-items: center; text-align: center; padding: 20px; gap: 18px; align-content: center; }
#orb { width: min(56vw, 300px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%, #000 100%); box-shadow: 0 0 80px 10px color-mix(in srgb, var(--c) 55%, transparent); transition: background .6s, box-shadow .6s; cursor: pointer; border: 0; }
#orb.hit { animation: hit .16s ease-out; }
@keyframes hit { from { transform: scale(var(--p, 1.07)); } }
#lvl { display: flex; gap: 8px; justify-content: center; }
#lvl i { width: 46px; height: 8px; border-radius: 4px; background: #2c2c2e; transition: background .3s; }
#lvl i.on { background: var(--c); }
#name { font-family: var(--display); font-size: 30px; min-height: 1.2em; }
#sub { color: #8e8e93; font-size: 15px; min-height: 3em; max-width: 30em; line-height: 1.45; }
.btns { display: flex; gap: 10px; }
button.b { font: inherit; font-weight: 900; font-size: 16px; border: 0; border-radius: 99px; padding: 12px 22px; cursor: pointer; background: #ffd60a; color: #000; }
button.b.g { background: #1c1c1e; color: #f5f5f7; }
</style>
</head>
<body>
<header><h1>Tension music</h1><a href="index.html">‹ Home</a></header>
<main>
  <div id="name">Tap to start</div>
  <button type="button" id="orb" aria-label="Raise the tension"></button>
  <div id="lvl"><i></i><i></i><i></i><i></i></div>
  <div id="sub">One note, over and over. Each tap raises the stakes: more layers, then a riser, then the boom.</div>
  <div class="btns"><button type="button" class="b" id="up">More tension</button><button type="button" class="b g" id="reset">Reset</button></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
// the five moments: what is added at each tap, in the story's words
const LEVELS = [
  { n: 'The first note', c: '#8e8e93', t: 'D, D, D, D. A pulse, nothing more. The room waits.' },
  { n: 'Something’s off', c: '#ff9f0a', t: 'A low drone under it, a tick between the beats, the pulse a little faster.' },
  { n: 'Danger', c: '#ff453a', t: 'A kick on every beat, a note that clashes (D against E♭), the pulse falls into a hole every fourth step.' },
  { n: 'The riser', c: '#bf5af2', t: 'Everything speeds up and climbs. It keeps rising… until the boom.' },
  { n: 'BOOM', c: '#ffd60a', t: 'Silence after it. Tap again to start over.' },
];
let ac, master, level = -1, timer, next = 0, step = 0, riseT0 = 0, drone, pad, tick = 0;
const D2 = 73.42;
function boot() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = .7;
  master.connect(comp); comp.connect(ac.destination);
}
function noiseBuf() { const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function pluck(t, f, peak = .5) {   // the note: a short triangle with a little attack
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = f; env(g, t, .005, peak, .22);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .25);
}
function kick(t) {
  const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  env(g, t, .002, .9, .28); o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
}
function hat(t, v = .12) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noiseBuf(); f.type = 'highpass'; f.frequency.value = 7000;
  env(g, t, .001, v, .05); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + .08);
}
function startDrone() {   // a sub D under it, growing slowly
  drone = ac.createOscillator(); const g = ac.createGain(); drone.type = 'sine'; drone.frequency.value = D2 / 2;
  g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.linearRampToValueAtTime(.38, ac.currentTime + 2.5); drone.connect(g); g.connect(master); drone.start(); drone.g = g;
}
function startPad() {   // the clash: D and E♭ together, a slow tremolo, through a low filter
  const f = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  f.type = 'lowpass'; f.frequency.value = 520; g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.linearRampToValueAtTime(.16, ac.currentTime + 2);
  lfo.frequency.value = 5.5; lg.gain.value = .07; lfo.connect(lg); lg.connect(g.gain); lfo.start();
  pad = [D2 * 2, D2 * 2 * 1.0595].map((fr) => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(); return o; });
  f.connect(g); g.connect(master); pad.g = g; pad.lfo = lfo;
}
function stopLayers(fade = .4) {
  const t = ac.currentTime;
  if (drone) { drone.g.gain.cancelScheduledValues(t); drone.g.gain.setTargetAtTime(0.0001, t, fade / 3); drone.stop(t + fade * 2); drone = null; }
  if (pad) { pad.g.gain.cancelScheduledValues(t); pad.g.gain.setTargetAtTime(0.0001, t, fade / 3); pad.forEach((o) => o.stop(t + fade * 2)); pad.lfo.stop(t + fade * 2); pad = null; }
}
function riser(t) {   // a noise sweep and a sine climbing, 4 s, then the boom
  riseT0 = t;
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); n.buffer = noiseBuf(); n.loop = true; f.type = 'bandpass'; f.Q.value = 3;
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(9000, t + 4);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.55, t + 4); g.gain.setValueAtTime(0.0001, t + 4.02);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t + 4.1);
  const o = ac.createOscillator(), og = ac.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(1320, t + 4);
  og.gain.setValueAtTime(0.0001, t); og.gain.linearRampToValueAtTime(.16, t + 4); og.gain.setValueAtTime(0.0001, t + 4.02);
  o.connect(og); og.connect(master); o.start(t); o.stop(t + 4.1);
  setTimeout(boom, 4000);
}
function boom() {
  if (level !== 3) return;
  const t = ac.currentTime; level = 4; clearInterval(timer); stopLayers(.2); show();
  const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.6);
  g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2); o.connect(g); g.connect(master); o.start(t); o.stop(t + 2.3);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), ng = ac.createGain(); s.buffer = noiseBuf(); f.type = 'lowpass'; f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(80, t + 1.2);
  ng.gain.setValueAtTime(.9, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 1.4); s.connect(f); f.connect(ng); ng.connect(master); s.start(t); s.stop(t + 1.5);
  flash(1.25);
}
// the loop: 16th steps, scheduled a little ahead of the clock
function bpm() { return level === 0 ? 92 : level === 1 ? 102 : level === 2 ? 116 : 120 + 110 * Math.min(1, (ac.currentTime - riseT0) / 4); }
function schedule() {
  while (next < ac.currentTime + .12) {
    const t = next, i = step % 16, bar = Math.floor(step / 16);
    if (level === 0) { if (i % 4 === 0) { pluck(t, D2, i === 0 ? .6 : .45); beat(t); } }
    if (level === 1) { if (i % 2 === 0) { pluck(t, D2, i % 8 === 0 ? .6 : .4); if (i % 4 === 0) beat(t); } if (i % 4 === 2) hat(t); }
    if (level === 2) {
      if (i % 2 === 0) pluck(t, i === 14 ? D2 * 1.0595 : D2, i % 8 === 0 ? .65 : .42);   // the E♭ lands on the last 8th
      if (i % 4 === 0) { kick(t); beat(t); } if (i % 2 === 1) hat(t, .1);
    }
    if (level === 3) { pluck(t, D2 * Math.pow(2, (t - riseT0) / 2.2), .4); if (i % 4 === 0) { kick(t); beat(t); } hat(t, .12); }
    next += 60 / bpm() / 4; step++;
  }
}
function go(l) {
  boot(); if (ac.state === 'suspended') ac.resume();
  clearInterval(timer);
  level = l; step = 0; next = ac.currentTime + .05;
  if (l >= 1 && !drone) startDrone();
  if (l >= 2 && !pad) startPad();
  if (l === 0) stopLayers();
  if (l === 3) riser(ac.currentTime + .05);
  timer = setInterval(schedule, 25); show();
}
function up() { if (level < 0 || level === 4) return go(0); if (level < 3) go(level + 1); }
// the screen follows the music
function beat(t) { setTimeout(() => flash(level >= 2 ? 1.1 : 1.07), Math.max(0, (t - ac.currentTime) * 1000)); }
function flash(p) { const o = $('#orb'); o.style.setProperty('--p', p); o.classList.remove('hit'); void o.offsetWidth; o.classList.add('hit'); }
function show() {
  const L = LEVELS[Math.max(level, 0)];
  document.documentElement.style.setProperty('--c', level < 0 ? '#8e8e93' : L.c);
  $('#name').textContent = level < 0 ? 'Tap to start' : L.n; $('#sub').textContent = level < 0 ? 'One note, over and over. Each tap raises the stakes: more layers, then a riser, then the boom.' : L.t;
  document.querySelectorAll('#lvl i').forEach((x, k) => x.classList.toggle('on', k <= level));
  $('#up').textContent = level < 0 ? 'Start' : level === 4 ? 'Again' : level === 3 ? '…rising' : 'More tension';
}
$('#orb').onclick = $('#up').onclick = up;
$('#reset').onclick = () => { if (!ac) return; clearInterval(timer); stopLayers(.1); level = -1; show(); };
</script>
</body>
</html>
